# =============================================================================
# build-release.yml - WORKFLOW UNIFICATO di rilascio RiPlay
#
# Unifica in UN SOLO processo ("unifica il processo di
# produzione delle varie versioni android con le varie versioni desktop"):
#
#   ANDROID  : APK firmati full + foss  (job build-apk, da build-release-apks)
#   DESKTOP  : pacchetti NATIVI Windows MSI / Linux DEB+RPM+AppImage / macOS DMG
#              (job build-desktop, con CEF PRE-SEMINATO: nessun download
#              ~200MB per l'utente al primo avvio)
#   ARCHIVI  : 7z AVD / WSA / WAYDROID  (dal job release, come da Version3)
#   RELEASE  : una sola GitHub Release con TUTTI gli asset + changelog
#
# Trigger:
#  - push di un tag v*          -> costruisce TUTTO (android + desktop) e
#                                  pubblica la release sul tag
#  - workflow_dispatch (manuale): si sceglie la "version" e COSA costruire
#                                  (all / android-only / desktop-only)
#
# NOTE TECNICHE:
#  - jpackage NON fa cross-building: ogni formato desktop esce solo dal
#    runner del suo sistema (MSI solo su windows-latest, DEB/RPM solo su
#    Linux, DMG solo su macOS). Il matrix build-desktop riflette questo.
#  - ubuntu-22.04 per il DEB: glibc di base piu' vecchio -> il pacchetto
#    gira anche su distribuzioni non recentissime (ubuntu-24.04 linkerebbe
#    una glibc nuova e il deb non si installerebbe sui sistemi vecchi).
#  - macOS DMG NON FIRMATO: alla prima apertura serve tasto destro -> Apri
#    (o `xattr -cr /Applications/RiPlay.app`). Per firmare/notarizzare:
#    aggiungere i segreti MACOS_CERTIFICATE (p12 base64),
#    MACOS_CERTIFICATE_PWD, APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD,
#    APPLE_TEAM_ID e i blocchi signing/notarization in build.gradle.kts
#    (composeApp, dentro macOS { ... }).
#  - Il bundle CEF viene seminato PRIMA della build con
#    scripts/fetch-kcef-bundle.sh e finisce DENTRO l'installer
#    (resources/kcef): l'app lo estrae al primo avvio nella directory
#    dati utente (KcefEngine.preSeedPackagedBundle). Dal v46 il formato
#    e' jcef-natives-<platform>-<tag>.tar.gz di jcefmaven, NON piu'
#    jbr_jcef dell'era KCEF (v. STEP 3ae).
#  - VLC resta un requisito DI SISTEMA per la riproduzione dei file locali.
#
# STEP 3u (fix DMG macOS):
#  - Il job macos-dmg e' fallito su macos-14 con "Execution failed for task
#    ':composeApp:createDistributable' > External tool execution failed ...
#    Exit code: 1". CAUSA: in fase app-image jpackage su macOS esegue per OGNI
#    file eseguibile/.dylib di RiPlay.app "codesign --remove-signature" +
#    "codesign -s -" (firma ad-hoc obbligatoria su Apple Silicon); se un solo
#    binario e' unsigned la build muore (issue JetBrains/compose-multiplatform#3586)
#    e l'errore reale viene loggato SOLO a livello verbose.
#  - RIMEDI in questo workflow: (1) -Pcompose.desktop.verbose=true +
#    -Pcompose.preserve.working.dir=true sul job mac -> jpackage --verbose
#    mostra i comandi codesign e il file colpevole; (2) retry x3 della build;
#    (3) step di diagnostica + artifact SOLO sul fallimento (args di jpackage
#    e Info.plist generati); (4) pulizia hdiutil dei volumi stale; (5) nel
#    build.gradle.kts di composeApp il runtime jlink viene pre-firmato ad-hoc
#    prima di jpackage (createRuntimeImage doLast).
#
# STEP 3y (fix artifact NON allegati alla release):
#  - SINTOMO: le 3 build desktop VERDI ma NESSUN installer (msi/deb/rpm/dmg)
#    allegato alla GitHub Release (gli APK invece c'erano).
#  - CAUSA (verificata sul README actions/upload-artifact@v4): con piu' search
#    path la root dell'artifact e' "the least common ancestor of all the
#    search paths". Lo step Upload del job desktop passava 4 glob
#    (binaries/main/msi|deb|rpm|dmg) il cui antenato comune e' binaries/main/
#    -> DENTRO l'artifact i pacchetti erano ANNIDATI (msi/..., deb/...,
#    dmg/...); il job release li cerca alla radice dell'artifact e non
#    trovandoli salta la rinomina IN SILENZIO (|| true) -> i glob statici
#    release-assets/*.msi ecc. non matchano nulla -> asset mai allegati.
#    Gli APK usavano UN solo search path (release-apks/*.apk) -> root
#    piatta -> per questo gli APK erano sempre presenti.
#  - RIMEDI: (1) staging PIATTO: nuovo step "Raccogli pacchetti" copia i
#    prodotti jpackage in desktop-packages/ (una sola dir = root piatta,
#    niente LCA) con assert per-OS sull'estensione attesa e fallimento
#    esplicito se vuota; (2) il job release VERIFICA gli asset attesi
#    (targets-aware: all / android-only / desktop-only) PRIMA di creare la
#    release ed esce con ::error:: se manca qualcosa (mai piu' silenzio);
#    (3) elenco file da allegare DINAMICO (env RELEASE_FILES costruita dai
#    file realmente presenti) + fail_on_unmatched_files: true;
#    (4) softprops/action-gh-release v1 -> v3 (v1 non manutenuta dal 2021;
#    v3 ha overwrite_files: un re-run sullo stesso tag SOVRASCRIVE gli asset
#    omonimi invece di fallire) e permissions: contents: write esplicite
#    (con token di default read-only la release falliva con 403).
#
# STEP 3ab (macOS x86_64 + migrazione runner obbligata):
#  - GITHUB HA RITIRATO l'immagine "macos-14" (changelog "macOS 14 runner
#    image retirement", 2026-10-01; "macos-13" era gia' ritirato a fine
#    2025): il vecchio job macos-dmg non riceverebbe piu' runner e la
#    build mac morirebbe alla scelta della macchina.
#  - MIGRAZIONE: macos-14 -> macos-15 (Apple Silicon arm64, 3 vCPU / 7 GB,
#    stesso profilo del vecchio macos-14; i cap STEP 3w restano).
#  - NUOVA BUILD INTEL (" versione x86_64
#    desktop per macOS"): esiste ancora un runner Intel gratuito,
#    "macos-15-intel" (x86_64 nativo, 4 vCPU / 14 GB, gratis sui repo
#    pubblici) -> nuovo job macos-dmg-x64. jpackage non fa cross-building:
#    serve un runner della stessa arch del target, qui e' NATIVA (niente
#    Rosetta).
#  - SEED CEF: anche il bundle segue l'arch del job (osx/aarch64 per arm,
#    osx/x64 per Intel) via fetch-kcef-bundle.sh (pre-v46: jbr_jcef; dal
#    v46: natives jcefmaven, v. STEP 3ae).
#  - NOMI ASSET (cambia rispetto alle release precedenti): i due DMG sono
#    distinguibili nel nome -> RiPlay-<tag>-macOS-arm64.dmg e
#    RiPlay-<tag>-macOS-x86_64.dmg (prima: RiPlay-<tag>-macOS.dmg).
#    Aggiornati rename, verifica asset attesi e testo release notes.
#  - Controllo ARCHITETTURA: nuovo step macOS-only dopo la build: lipo
#    -archs su binario app image e runtime bundlato, con assert sull'arch
#    attesa della matrix (arm64 / x86_64).
#  - Controllo KCEF: il Controllo STEP 3x ora controlla anche la presenza
#    del motore KCEF v44 (bootstrap "v44 (step3z)") nel codice eseguito:
#    protegge dal regresso al motore v37 (bug chrome_elf su Linux ai
#    riavvii + crash macOS). [v46: il marker del controllo ora e' "v46
#    (jcefmaven)", v. STEP 3ae]
#  - DIAGNOSTICA jpackage: artifact rinominato per-job
#    (macos-jpackage-diagnostics-<nome job>) perche' con due job mac un
#    nome unico andrebbe in conflitto se entrambi fallissero nella run.
#
# STEP 3ac (AppImage Linux):
#  - Aggiunto'AppImage agli asset della GitHub Release.
#  - jpackage NON produce AppImage: si wrappa l'app-image di jpackage
#    (task :composeApp:createDistributable -> binaries/main/app/RiPlay, gia'
#    completo di launcher, jar, runtime JRE e CEF pre-seminato) in un .AppDir
#    (AppRun + RiPlay.desktop + icone + .DirIcon) compresso con appimagetool
#    (da STEP 3ag: il successore ufficiale "AppImage/appimagetool", lanciato
#    con --appimage-extract-and-run perche' i runner CI non hanno libfuse2).
#  - Il job linux-deb-rpm costruisce deb+rpm+AppImage nella STESSA run (stesso
#    checkout, stesso seed CEF, stessa JDK; ubuntu-22.04 come per il deb:
#    glibc base piu' vecchio -> compatibilita' anche con distro non recenti).
#    createDistributable e' stato aggiunto alla matrix (costo ~1-2 min:
#    condivide jar/jlink con deb/rpm).
#  - RICETTA VALIDATA in locale (nov 2026) con appimagetool continuous:
#    (1) ARCH=x86_64 va impostato ESPLICITAMENTE (il guessing dell'arch
#    fallisce se appimagetool non aggancia un ELF); (2) l'icona va copiata
#    ANCHE alla radice dell'AppDir (riplay.png), hicolor da solo non basta
#    ("riplay{.png,.svg,.xpm} defined in desktop file but not found").
#  - Canarini post-build: eseguibile, dimensione >= 50MB, magic type 2
#    all'offset 8 ("AI\x02" = 41 49 02) verificato con dd/od.
#  - Staging/assert/release: '*.AppImage' aggiunto a "Raccogli pacchetti" e
#    all'assert per-OS del runner Linux; nome canonico
#    RiPlay-<tag>-Linux-x86_64.AppImage; verifica asset attesi (all e
#    desktop-only) e release notes aggiornate.
#
# STEP 3ad (zsync / AppImageUpdate):
#  - Produce il file .zsync per gli aggiornamenti
#    incrementali (AppImageUpdate scarica solo i blocchi modificati).
#  - FORMATO VERIFICATO SUI SORGENTI (AppImageKit appimagetool.c, guess
#    dell'autore): "gh-releases-zsync|<user>|<repo>|<tag>|<pattern>", il 3o
#    campo puo' essere "latest" e il 4o campo matcha il NOME DELL'ASSET
#    .AppImage.zsync della release (es. nel sorgente: "gh-releases-zsync|
#    probono|AppImages|latest|Subsurface*-x86_64.AppImage.zsync"). Non serve
#    quindi un nome asset stabile tra le release (superato il compromesso
#    del STEP 3ac).
#  - appimagetool con -u/--updateinformation EMBEDDE la stringa nella sezione
#    ELF .upd_info e genera anche lui un .zsync, ma con "-u basename"
#    RELATIVO: su GitHub Releases con nomi versionati l'URL relativo
#    risolverebbe 404 -> il workflow lo RIGENERA con zsyncmake (pacchetto
#    apt "zsync") e -u ASSOLUTO canonico. Il .zsync classico copre il FILE
#    INTERO (verificato in locale: Length/SHA-1 == file reale).
#  - E2E VALIDATO IN LOCALE (nov 2026): v1 e v2 (8KB diversi), update info
#    embedduta e ritrovata nel binario, client zsync2 con seed v1 -> output
#    con SHA-1 IDENTICO a v2 ("checksum matches OK"). NB il server di test
#    DEVE supportare Range/206 (GitHub Releases/S3 lo fa nativamente).
#  - Note: l'efficienza del delta su squashfs dipende dall'allineamento dei
#    blocchi compressi (modifiche sparse riducono il riuso dei seed); il
#    meccanismo resta quello ufficiale di tutti i progetti AppImage con
#    update information. AppImageUpdate usa l'API GitHub anonima (rate limit
#    60/h per IP: accettabile per un check di aggiornamento).
#
# STEP 3ae (v46: PRE-SEED CEF migrato a jcefmaven):
#  - Con la migrazione del motore browser a jcefmaven 152.0.6 (KcefEngine
#    v46) l'app NON riconosce piu' gli archivi jbr_jcef (JetBrains Runtime)
#    dell'era KCEF: KcefEngine.packagedCefBundle() accetta SOLO
#    "jcef-natives-<platform>-<tag>.tar.gz" (platform = EnumPlatform di
#    jcefmaven: windows-amd64 | linux-amd64 | macosx-amd64 | macosx-arm64)
#    e gli archivi jbr_jcef restano nel pacchetto come file inutili (log
#    "archivio KCEF obsoleto ... ignorato" a runtime).
#  - scripts/fetch-kcef-bundle.sh RISCRITTO (stessa CLI seed_os/seed_arch,
#    nessun'altra modifica al workflow): (1) legge la versione jcefmaven
#    da gradle/libs.versions.toml (fonte di verita' della build); (2) risale
#    al release tag completo (es. jcef-17e805a+cef-152.0.6+g708dc14+
#    chromium-152.0.7977.83) dagli asset della release GitHub di jcefmaven
#    (con GITHUB_TOKEN; fallback maven-metadata.xml con retry); (3) scarica
#    il jar natives (primario GitHub release asset, fallback Maven Central:
#    le stesse URL che usa CefAppBuilder di jcefmaven); (4) estrae il
#    .tar.gz dal jar (python -> unzip -> jar JDK: copre tutti i runner);
#    (5) semina in composeApp/desktop-resources/<windows|linux|macos>/kcef/
#    con canarini: dimensione >= 50MB, tar leggibile, build_meta.json alla
#    radice (richiesto dal pre-seed dell'app: install.lock + meta senza
#    ri-download).
#  - NB CARTELLA macOS = "macos" (sottocartella riconosciuta dalla DSL
#    Compose appResourcesRootDir: common|linux|windows|macos): un seed in
#    "osx/" NON verrebbe incluso nell'installer.
#  - COERENZA TAG GARANTITA: il tag e' preso dalla release della STESSA
#    versione jcefmaven del toml e lo script fallisce se il tag non cita
#    "cef-<versione>" (l'app ignora archivi con tag diverso da
#    CefBuildInfo.fromClasspath() e jcefmaven scaricherebbe comunque).
#  - CONTROLLO STEP 3x aggiornato: il marker del motore ora e' "v46
#    (jcefmaven)" (BOOTSTRAP_VERSION in KcefEngine.kt); il vecchio grep
#    "v44 (step3z)" NON matcha piu' il codice migrato (falso allarme a
#    ogni run) e il controllo "kotlin.daemon.jvmargs=-Xmx4g" resta invariato.
#  - DIMENSIONI INSTALLER (comportamento atteso): il bundle seminato e'
#    ~153MB (linux-amd64), ~143MB (macosx-arm64), ~171MB (windows-amd64):
#    MSI/DEB/RPM/DMG/AppImage crescono di conseguenza. Senza seed lo
#    script fallisce con messaggio chiaro, mai release senza CEF.
#  - SCRIPT VALIDATO (nov 2026) con download reali per le tre piattaforme
#    (linux-amd64 152.9MB, macosx-arm64 142.5MB, windows-amd64 171.4MB):
#    exit 0, canarini OK, idempotenza OK (re-run = skip download).
#
# STEP 3ag (AppImage SENZA libfuse2: runtime type2 STATICO):
#  - PROBLEMA: il runtime di AppImageKit usato finora monta il suo squashfs
#    caricando FUSE2 DINAMICAMENTE dal sistema (dlopen libfuse.so.2): su
#    Ubuntu 23.04+/24.04, Fedora 38+ ecc. libfuse2 non e' preinstallata,
#    l'utente vedeva "dlopen(): error loading libfuse.so.2" e doveva
#    installare "libfuse2"/"libfuse2t64" oppure lanciare l'AppImage con
#    --appimage-extract-and-run (compromesso del STEP 3ac).
#  - FIX: l'AppImage viene prodotta con il RUNTIME STATICO ufficiale
#    AppImage/type2-runtime (compilato in chroot Alpine con musl, fuse2
#    linkato staticamente NEL runtime): "Since the runtime is linked
#    statically, libfuse2 is no longer required on the target system"
#    (README). Verificato sul binario: NESSUN dlopen di libfuse.so.2, il
#    mount usa /dev/fuse e cerca un helper fusermount sul PATH (fusermount3
#    delle distro con fuse3 va bene; in assenza resta il fallback
#    --appimage-extract-and-run). Approccio gia' in produzione altrove
#    (es. VeraCrypt, issue #1595).
#  - MIGRAZIONE TOOL: AppImageKit/appimagetool (ultimo rilascio reale 2021)
#    -> "AppImage/appimagetool", il successore ufficiale mantenuto: STESSA
#    CLI (--updateinformation, --appimage-extract-and-run, ARCH=,
#    --runtime-file), mksquashfs moderno (risolve il bug di determinismo
#    multi-thread AppImageKit #929). Di default SCARICA il runtime al volo
#    da type2-runtime: qui lo PINNAMO con --runtime-file usando il runtime
#    pre-scaricato e verificato nel step "Setup appimagetool" (determinismo
#    + canarini PRIMA dell'uso, niente fetch nascosto in build).
#  - CANARINI runtime (step Setup): ELF (7f454c46), >= 512KB, ldd "not a
#    dynamic executable" (static-pie musl), readelf -d senza NEEDED libfuse.
#    CANARINI POST-BUILD (step Costruisci): la STESSA staticita' imposta
#    sull'AppImage prodotta -> la build fallisce se la dipendenza libfuse2
#    fosse reintrodotta (mai release con compromesso ritornato in silenzio).
#  - E2E VALIDATO IN LOCALE (nov 2026): appimagetool continuous build 370
#    (git 11d54c9, 2026-11-06) + runtime-x86_64 (923KB, static-pie): build
#    exit 0, magic type 2 (414902) a offset 8, update information embedduta
#    in .upd_info, .zsync auto-generato, payload eseguito con
#    --appimage-extract-and-run, ldd "not a dynamic executable", zero NEEDED.
#  - AppImageUpdate/zsync (STEP 3ad): NESSUN IMPATTO: l'update information
#    vive nella sezione ELF .upd_info (embedding identico) e il .zsync
#    rigenerato copre il FILE INTERO (runtime incluso). Il runtime continuous
#    puo' cambiare tra release (delta poco efficienti su ~1MB): accettabile.
#  - NB: il TOOL appimagetool resta lui stesso un AppImage: sul runner CI
#    (senza libfuse2) si lancia SEMPRE con --appimage-extract-and-run;
#    quella necessita' riguarda la macchina di BUILD, non l'artefatto.
# ==============================================================================

name: Build and Release RiPlay

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g., v1.0.0)'
        required: true
        type: string
      targets:
        description: 'Cosa costruire'
        required: true
        type: choice
        default: 'all'
        options:
          - all
          - android-only
          - desktop-only

concurrency:
  group: build-release-${{ github.ref }}
  cancel-in-progress: true

# STEP 3y: permessi espliciti per creare la release e caricare gli asset
# (se il repo limita il token di default a read-only, la creazione della
# release fallisce con 403 "Resource not accessible by integration")
permissions:
  contents: write

jobs:
  # ===========================================================================
  # 1) VALIDAZIONE: formato versione + tag non esistente + sync a main
  # ===========================================================================
  validate:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      targets: ${{ steps.targets.outputs.targets }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch latest commits
        if: github.event_name == 'workflow_dispatch'
        run: |
          git fetch origin main
          git reset --hard origin/main
          echo "✅ Synced to latest commit on main"

      - name: Validate version format and check if tag exists
        if: github.event_name == 'workflow_dispatch'
        env:
          # 🔧 FIX: input passato via env, non iniettato nello script
          VERSION: ${{ github.event.inputs.version }}
        run: |
          if [[ ! $VERSION =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "❌ Invalid version format! Use v1.0.0"
            exit 1
          fi

          if git rev-parse "$VERSION" >/dev/null 2>&1; then
            echo "❌ Tag $VERSION already exists!"
            exit 1
          fi

          echo "✅ Version $VERSION is valid and new"

      - name: Resolve version output
        id: resolve
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          CURRENT_TAG="$INPUT_VERSION"
          if [ -z "$CURRENT_TAG" ]; then
            CURRENT_TAG="${GITHUB_REF_NAME}"
          fi
          echo "version=$CURRENT_TAG" >> "$GITHUB_OUTPUT"

      - name: Resolve targets output
        id: targets
        env:
          INPUT_TARGETS: ${{ github.event.inputs.targets }}
        run: |
          TARGETS="$INPUT_TARGETS"
          if [ -z "$TARGETS" ]; then
            # push di un tag -> si costruisce tutto
            TARGETS="all"
          fi
          echo "targets=$TARGETS" >> "$GITHUB_OUTPUT"

  # ===========================================================================
  # 2) ANDROID: APK firmati full + foss (matrix, invariato dallo script V3)
  # ===========================================================================
  build-apk:
    needs: validate
    if: >-
      github.event_name == 'push' ||
      needs.validate.outputs.targets == 'all' ||
      needs.validate.outputs.targets == 'android-only'
    runs-on: ubuntu-latest
    # Se uno dei due flavor si blocca davvero, fallisce dopo N minuti invece di
    # restare appeso fino al timeout di 6h del job (o a una cancellazione manuale)
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - flavor: full
            gradle_task: :androidApp:assembleFull
            build_variant: ""
          - flavor: foss
            gradle_task: :androidApp:assembleFoss
            build_variant: "foss"
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch latest commits
        if: github.event_name == 'workflow_dispatch'
        run: |
          git fetch origin main
          git reset --hard origin/main

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Decode keystore from secrets to temp directory
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          mkdir -p "${RUNNER_TEMP}/keystore"
          echo "$KEYSTORE_BASE64" | base64 -d > "${RUNNER_TEMP}/keystore/RiPlayKeystore.jks"
          chmod 600 "${RUNNER_TEMP}/keystore/RiPlayKeystore.jks"

      - name: Build Release APK - ${{ matrix.flavor }} flavor
        env:
          SIGNING_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          SIGNING_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          SIGNING_STORE_FILE: ${{ runner.temp }}/keystore/RiPlayKeystore.jks
        run: |
          ./gradlew ${{ matrix.gradle_task }} -PBUILD_VARIANT=${{ matrix.build_variant }} \
            --no-daemon --stacktrace --max-workers=2

      - name: Clean up sensitive files
        if: always()
        run: |
          rm -rf "${RUNNER_TEMP}/keystore"
          echo "✅ Keystore removed from temporary directory"

      - name: Collect APK for this flavor
        run: |
          mkdir -p release-apks
          find androidApp -name "*.apk" -path "*/release/*" -exec cp {} release-apks/ \;
          ls -lah release-apks/

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ matrix.flavor }}
          path: release-apks/*.apk
          retention-days: 1

  # ===========================================================================
  # 3) DESKTOP: pacchetti NATIVI MSI / DEB+RPM / DMG (matrix per-OS, jpackage
  #    non fa cross-building) con CEF pre-seminato dentro l'installer
  # ===========================================================================
  build-desktop:
    needs: validate
    if: >-
      github.event_name == 'push' ||
      needs.validate.outputs.targets == 'all' ||
      needs.validate.outputs.targets == 'desktop-only'
    name: desktop-${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-msi
            os: windows-latest
            tasks: :composeApp:packageMsi
            seed_os: windows
            seed_arch: x64
            extra_flags: ''
          # ubuntu-22.04: glibc base piu' vecchio -> il deb gira anche su
          # distribuzioni non recentissime (vale anche per l'AppImage, STEP 3ac)
          # STEP 3ac: createDistributable aggiunto -> produce l'app-image
          # jpackage (binaries/main/app/RiPlay) da cui il job costruisce
          # ANCHE l'AppImage (stesso checkout/seed CEF/JDK di deb e rpm)
          - name: linux-deb-rpm
            os: ubuntu-22.04
            tasks: :composeApp:packageDeb :composeApp:packageRpm :composeApp:createDistributable
            seed_os: linux
            seed_arch: x64
            extra_flags: ''
          # STEP 3ab: macos-14 RITIRATO da GitHub (1 ott 2026) -> macos-15
          # (Apple Silicon arm64, 3 vCPU / 7 GB, stesso profilo)
          - name: macos-dmg
            os: macos-15
            tasks: :composeApp:packageDmg
            seed_os: osx
            seed_arch: aarch64
            expect_arch: arm64
            # STEP 3u: jpackage --verbose (log completo dei comandi codesign
            # interni) + working dir preservata per la diagnostica post-fallimento
            # STEP 3w: cap Kotlin daemon ridotto (runner mac arm = 7GB; i cap
            # teorici 4g+4g di gradle.properties sono pensati per i runner 16GB,
            # la compilazione desktop resta <1.5GB)
            extra_flags: '-Pcompose.desktop.verbose=true -Pcompose.preserve.working.dir=true -Pkotlin.daemon.jvmargs=-Xmx2g'
          # STEP 3ab: build Intel NATIVA (versione x86_64
          # desktop per macOS). macos-15-intel = runner x86_64 (4 vCPU /
          # 14 GB, gratuito sui repo pubblici); jpackage non fa
          # cross-building quindi serve un runner del target.
          - name: macos-dmg-x64
            os: macos-15-intel
            tasks: :composeApp:packageDmg
            seed_os: osx
            seed_arch: x64
            expect_arch: x86_64
            extra_flags: '-Pcompose.desktop.verbose=true -Pcompose.preserve.working.dir=true -Pkotlin.daemon.jvmargs=-Xmx2g'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch latest commits
        if: github.event_name == 'workflow_dispatch'
        run: |
          git fetch origin main
          git reset --hard origin/main

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      # Il modulo chaquopy (python 3.13) e' configurato nella stessa build
      # Gradle: il setup evita sorprese in fase di configurazione
      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # STEP 3x: Controllo diagnostico — mostra nel log QUALI fix sono presenti
      # nel codice realmente eseguito dalla run (un tag creato su un commit
      # vecchio, o un checkout su ref diverso, gira su codice SENZA i fix:
      # ora si vede subito). shell bash per compatibilita' win/linux/mac
      - name: Controllo fix versioni/heap nel codice di questa run
        shell: bash
        run: |
          echo "=== STEP 3x Controllo: fix presenti nel codice eseguito ==="
          if grep -n "riplayPackageVersionForHost" composeApp/build.gradle.kts; then
            echo "OK: fix versione mac-safe (STEP 3v/3x) PRESENTE"
          else
            echo "!! ATTENZIONE: fix versione mac-safe ASSENTE — run su codice vecchio (tag su commit vecchio? checkout su ref diverso?) !!"
          fi
          if grep -n "kotlin.daemon.jvmargs=-Xmx4g" gradle.properties; then
            echo "OK: fix memoria Kotlin daemon (STEP 3w) PRESENTE"
          else
            echo "!! ATTENZIONE: fix memoria (kotlin.daemon.jvmargs=-Xmx4g) ASSENTE — run su codice vecchio !!"
          fi
          # STEP 3ae: il motore v46 (jcefmaven) vive SOLO nel repo aggiornato
          # alla migrazione: se questo grep fallisce la run gira su codice
          # pre-migrazione (KCEF), che NON riconoscerebbe il pre-seed
          # jcef-natives seminato qui (formato v46) e i pacchetti uscirebbero
          # senza CEF pre-seminato (download ~150MB per l'utente al primo
          # avvio). Il vecchio marker "v44 (step3z)" non esiste piu' nel
          # codice migrato: il grep vecchio dava falso allarme a ogni run.
          if grep -n "v46 (jcefmaven)" composeApp/src/jvmMain/kotlin/it/fast4x/riplay/player/kcef/KcefEngine.kt; then
            echo "OK: motore CEF v46 (jcefmaven) PRESENTE"
          else
            echo "!! ATTENZIONE: motore CEF v46 (jcefmaven) ASSENTE — run su codice pre-migrazione KCEF: il pre-seed jcef-natives verrebbe ignorato !!"
          fi
          # STEP 3ae: mostra la versione jcefmaven della build. Il tag del
          # bundle seminato (fetch-kcef-bundle.sh) deriva da QUESTA versione:
          # se il toml e il jar jcef-api non coincidono, l'app ignora il
          # pre-seed e jcefmaven scarichera' il bundle al primo avvio.
          if grep -n '^jcefmaven[[:space:]]*=' gradle/libs.versions.toml; then
            echo "OK: versione jcefmaven presente nel toml (fonte del tag pre-seed)"
          else
            echo "!! ATTENZIONE: chiave 'jcefmaven' ASSENTE nel toml: fetch-kcef-bundle.sh fallira' in fase di seed !!"
          fi

      # STEP 3ae: semina l'archivio natives jcefmaven (formato v46:
      # jcef-natives-<platform>-<tag>.tar.gz) in
      # composeApp/desktop-resources/<windows|linux|macos>/kcef/ -> jpackage
      # lo include nell'installer (resources/kcef). La CLI e' IDENTICA al
      # vecchio seed jbr_jcef (seed_os/seed_arch della matrix, invariata);
      # lo script legge la versione jcefmaven dal toml e ne deriva il tag,
      # cosi' il bundle coincide sempre con CefBuildInfo dell'app.
      - name: Pre-seed bundle CEF (jcefmaven natives)
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          bash scripts/fetch-kcef-bundle.sh "${{ matrix.seed_os }}" "${{ matrix.seed_arch }}"
          find composeApp/desktop-resources -type f | head

      # STEP 3u: i runner macOS a volte lasciano volumi DMG montati da run
      # precedenti; se /Volumes/RiPlay* esiste gia' il packaging DMG fallisce
      # con "hdiutil: create failed - File exists". Pulizia preventiva.
      - name: Pulizia volumi hdiutil stale (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          for v in /Volumes/RiPlay*; do
            if [ -e "$v" ]; then
              echo "Detaching stale volume: $v"
              hdiutil detach "$v" -force || true
            fi
          done
          ls -1 /Volumes || true

      # STEP 3u: retry x3 (le fasi di codesign/hdiutil di jpackage sui runner
      # CI hanno una famiglia di guasti transitori documentati). Con verbose il
      # log mostra i comandi interni esatti anche quando un tentativo fallisce.
      - name: Build pacchetto desktop (${{ matrix.name }})
        shell: bash
        run: |
          set -u
          attempt=1
          max_attempts=3
          while [ "$attempt" -le "$max_attempts" ]; do
            echo "::group::Tentativo ${attempt}/${max_attempts} - ./gradlew ${{ matrix.tasks }} ${{ matrix.extra_flags }}"
            if ./gradlew ${{ matrix.tasks }} ${{ matrix.extra_flags }} --no-daemon --stacktrace; then
              echo "::endgroup::"
              echo "✅ Build riuscita al tentativo ${attempt}"
              exit 0
            fi
            echo "::endgroup::"
            attempt=$((attempt + 1))
            if [ "$attempt" -le "$max_attempts" ]; then
              echo "⚠️ Tentativo fallito, riprovo tra 15 secondi..."
              sleep 15
            fi
          done
          echo "❌ Build fallita dopo ${max_attempts} tentativi"
          exit 1

      # STEP 3ag: appimagetool e' il successore ufficiale "AppImage/
      # appimagetool" (stessa CLI di AppImageKit, mksquashfs moderno, v.
      # header STEP 3ag) e gli viene affiancato il runtime STATICO
      # "type2-runtime" (fuse2 linkato staticamente nel runtime: l'AppImage
      # FINALE non richiede libfuse2 sul sistema dell'utente). Entrambi
      # scaricati in RUNNER_TEMP con retry; il runtime viene VERIFICATO con
      # canarini (ELF, statico, zero NEEDED libfuse) PRIMA dell'uso e i path
      # passano via GITHUB_ENV (APPIMAGETOOL / APPIMAGE_RUNTIME).
      # Il TOOL resta un AppImage: sui runner CI (senza libfuse2) si lancia
      # sempre con --appimage-extract-and-run; --version come smoke test
      # (verificato: exit 0, printa commit e data di build).
      # STEP 3ad: apt "zsync" fornisce zsyncmake (formato classico full-file)
      # per il .zsync canonico dell'update delta.
      - name: Setup appimagetool + zsync (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq zsync
          zsyncmake --version | head -1
          # STEP 3ag: appimagetool (successore ufficiale di AppImageKit)
          TOOL="appimagetool-x86_64.AppImage"
          URL="https://github.com/AppImage/appimagetool/releases/download/continuous/${TOOL}"
          echo "⬇️ Download ${TOOL} (AppImage/appimagetool continuous)"
          curl -fL --retry 3 --retry-delay 5 -o "${RUNNER_TEMP}/${TOOL}" "${URL}"
          chmod +x "${RUNNER_TEMP}/${TOOL}"
          "${RUNNER_TEMP}/${TOOL}" --appimage-extract-and-run --version
          echo "APPIMAGETOOL=${RUNNER_TEMP}/${TOOL}" >> "$GITHUB_ENV"
          # STEP 3ag: runtime type2 STATICO (fuse2 linkato staticamente NEL
          # runtime -> l'AppImage prodotta NON richiede libfuse2 sull'host)
          RUNTIME="runtime-x86_64"
          RURL="https://github.com/AppImage/type2-runtime/releases/download/continuous/${RUNTIME}"
          echo "⬇️ Download ${RUNTIME} (type2-runtime statico: no libfuse2)"
          curl -fL --retry 3 --retry-delay 5 -o "${RUNNER_TEMP}/${RUNTIME}" "${RURL}"
          chmod +x "${RUNNER_TEMP}/${RUNTIME}"
          rsize=$(stat -c%s "${RUNNER_TEMP}/${RUNTIME}")
          echo "📦 runtime statico: ${rsize} bytes"
          if [ "${rsize}" -lt 524288 ]; then
            echo "❌ runtime statico sospettosamente piccolo (<512KB): download corrotto?"
            exit 1
          fi
          rmagic=$(head -c 4 "${RUNNER_TEMP}/${RUNTIME}" | od -An -tx1 | tr -d ' \n')
          if [ "${rmagic}" != "7f454c46" ]; then
            echo "❌ runtime statico: magic ELF mancante (${rmagic})"
            exit 1
          fi
          # canarino STATICITA' (verificato in locale nov 2026 sul runtime
          # continuous: ELF static-pie musl): ldd dice "not a dynamic
          # executable" (ed esce 1 -> catturato con || true) e readelf -d
          # non ha NESSUNA sezione NEEDED che cita libfuse
          lddout=$(ldd "${RUNNER_TEMP}/${RUNTIME}" 2>&1 || true)
          echo "🔎 ldd runtime: ${lddout}"
          if ! echo "${lddout}" | grep -q "not a dynamic executable"; then
            echo "❌ runtime type2 NON statico (ldd mostra dipendenze dinamiche): rifiuto, reintrodurrebbe libfuse2"
            exit 1
          fi
          if readelf -d "${RUNNER_TEMP}/${RUNTIME}" 2>/dev/null | grep NEEDED | grep -qi libfuse; then
            echo "❌ runtime type2 con NEEDED libfuse: non e' il runtime statico atteso"
            exit 1
          fi
          echo "✅ runtime statico verificato: zero dipendenze dinamiche, zero NEEDED libfuse"
          echo "APPIMAGE_RUNTIME=${RUNNER_TEMP}/${RUNTIME}" >> "$GITHUB_ENV"

      # STEP 3ac: jpackage non produce AppImage -> l'app-image di
      # createDistributable (launcher + jar + runtime JRE + CEF seminato)
      # viene wrappato in un .AppDir e compresso con appimagetool. Output in
      # composeApp/build/compose/binaries/appimage/ cosi' "Raccogli pacchetti"
      # (che scansiona binaries) lo trova senza toccare altro.
      # Le due lezioni del test locale: ARCH=x86_64 esplicito e icona copiata
      # ANCHE alla radice dell'AppDir (riplay.png).
      # STEP 3ad: update information gh-releases-zsync embeddta (AppImageUpdate
      # la legge dalla sezione ELF .upd_info) e .zsync rigenerato con URL
      # assoluto canonico (l'auto-generato da appimagetool ha URL relativo ->
      # risolverebbe 404 su GitHub Releases versionate).
      # STEP 3ag: compressione con --runtime-file (runtime type2 STATICO
      # pre-scaricato e verificato in "Setup appimagetool"): l'AppImage
      # finale monta il suo squashfs SENZA cercare libfuse2 sul sistema.
      # Post-build: canarini ldd/readelf che impongono zero NEEDED libfuse.
      - name: Costruisci AppImage (Linux)
        if: runner.os == 'Linux'
        shell: bash
        env:
          CURRENT_TAG: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          APP_SRC="composeApp/build/compose/binaries/main/app/RiPlay"
          if [ ! -x "${APP_SRC}/bin/RiPlay" ]; then
            echo "❌ app-image jpackage non trovato: ${APP_SRC}"
            find composeApp/build/compose/binaries -maxdepth 4 || true
            exit 1
          fi
          ICON="composeApp/desktop-icons/icon-linux.png"
          if [ ! -f "${ICON}" ]; then
            echo "❌ icona Linux non trovata: ${ICON}"
            exit 1
          fi
          APPDIR="composeApp/build/appimage/RiPlay.AppDir"
          rm -rf "${APPDIR}"
          mkdir -p "${APPDIR}/usr/bin" \
                   "${APPDIR}/usr/share/icons/hicolor/128x128/apps" \
                   "${APPDIR}/usr/share/icons/hicolor/256x256/apps"
          # app-image jpackage: launcher + lib/app/*.jar + lib/runtime (JRE) + resources/kcef
          cp -a "${APP_SRC}" "${APPDIR}/usr/bin/RiPlay"
          # icona: radice (richiesta da appimagetool) + hicolor (integrazione desktop)
          cp "${ICON}" "${APPDIR}/riplay.png"
          for d in 128x128 256x256; do
            cp "${ICON}" "${APPDIR}/usr/share/icons/hicolor/${d}/apps/riplay.png"
          done
          ln -sfn riplay.png "${APPDIR}/.DirIcon"
          # stessi metadati del blocco linux{} di nativeDistributions (menuGroup)
          cat > "${APPDIR}/RiPlay.desktop" <<'DESKTOP_EOF'
          [Desktop Entry]
          Name=RiPlay
          Comment=RiPlay Desktop Music Player
          Exec=AppRun
          Icon=riplay
          Terminal=false
          Type=Application
          Categories=Audio;AudioVideo;
          DESKTOP_EOF
          # AppRun: lancia il launcher jpackage self-contained (bin/RiPlay + lib/)
          cat > "${APPDIR}/AppRun" <<'APPRUN_EOF'
          #!/bin/sh
          HERE="$(dirname "$(readlink -f "$0")")"
          exec "$HERE/usr/bin/RiPlay/bin/RiPlay" "$@"
          APPRUN_EOF
          chmod +x "${APPDIR}/AppRun"
          # STEP 3ad: update information per AppImageUpdate (formato verificato
          # su appimagetool.c: 3o campo tag con "latest" supportato, 4o campo =
          # pattern sul nome dell'asset .AppImage.zsync). Se il repo non e'
          # noto (run locale) si salta l'embedding: l'AppImage resta valida.
          GH_SLUG="${GITHUB_REPOSITORY:-}"
          GH_OWNER="${GH_SLUG%%/*}"
          GH_REPO="${GH_SLUG#*/}"
          UPDATEINFO=""
          UI_ARGS=()
          if [ -n "${GH_OWNER}" ] && [ -n "${GH_REPO}" ]; then
            UPDATEINFO="gh-releases-zsync|${GH_OWNER}|${GH_REPO}|latest|RiPlay-*-Linux-x86_64.AppImage.zsync"
            echo "ℹ️ update information: ${UPDATEINFO}"
            UI_ARGS=(--updateinformation "${UPDATEINFO}")
          else
            echo "⚠️ GITHUB_REPOSITORY assente: AppImage senza update information embedded"
          fi
          mkdir -p composeApp/build/compose/binaries/appimage
          OUT="composeApp/build/compose/binaries/appimage/RiPlay-Linux-x86_64.AppImage"
          # STEP 3ag: guard + --runtime-file usa il runtime statico
          # pre-verificato (al posto del fetch live / runtime legacy)
          if [ -z "${APPIMAGE_RUNTIME:-}" ]; then
            echo "❌ APPIMAGE_RUNTIME non impostato (Setup appimagetool non girato?)"
            exit 1
          fi
          echo "🔨 appimagetool -> ${OUT} (runtime statico: ${APPIMAGE_RUNTIME})"
          ARCH=x86_64 "${APPIMAGETOOL}" --appimage-extract-and-run \
            --runtime-file "${APPIMAGE_RUNTIME}" \
            "${UI_ARGS[@]}" "${APPDIR}" "${OUT}" \
            > appimage-build.log 2>&1 || APPIMAGE_FAILED=1
          grep -v -e "Failed to remove" -e "File exists and file size matches" appimage-build.log || true
          if [ -n "${APPIMAGE_FAILED:-}" ]; then
            echo "❌ appimagetool fallito — log completo sopra (appimage-build.log)"
            exit 1
          fi
          # canarini: eseguibile, dimensione minima, magic AppImage type 2 (offset 8 = AI\x02)
          if [ ! -x "${OUT}" ]; then echo "❌ AppImage non prodotta/non eseguibile"; exit 1; fi
          size=$(stat -c%s "${OUT}")
          echo "📦 ${OUT}: ${size} bytes"
          if [ "${size}" -lt 52428800 ]; then
            echo "❌ AppImage sospettosamente piccola (<50MB): runtime o CEF mancanti?"
            exit 1
          fi
          magic=$(dd if="${OUT}" bs=1 skip=8 count=3 2>/dev/null | od -An -tx1 | tr -d ' \n')
          echo "🔎 magic offset 8: ${magic} (atteso 414902 = AI\\x02)"
          if [ "${magic}" != "414902" ]; then
            echo "❌ magic AppImage type 2 non riconosciuto"
            exit 1
          fi
          # STEP 3ag: canarini runtime statico sull'AppImage PRODOTTA (la
          # prova che la dipendenza da libfuse2 e' davvero sparita): ldd
          # deve dire "not a dynamic executable" (musl static-pie, esce 1 ->
          # catturato con || true) e readelf -d non deve avere NEEDED libfuse
          aldd=$(ldd "${OUT}" 2>&1 || true)
          echo "🔎 ldd AppImage: $(echo "${aldd}" | head -1)"
          if echo "${aldd}" | grep -q "not a dynamic executable"; then
            echo "✅ runtime statico nell'AppImage: libfuse2 NON richiesta sul sistema (STEP 3ag)"
          else
            echo "❌ runtime NON statico nell'AppImage prodotta: dipendenza libfuse2 reintrodotta?"
            exit 1
          fi
          if readelf -d "${OUT}" 2>/dev/null | grep NEEDED | grep -qi libfuse; then
            echo "❌ NEEDED libfuse nell'AppImage prodotta (runtime statico non embeddato?)"
            exit 1
          fi
          echo "✅ zero NEEDED libfuse nell'AppImage prodotta"
          # STEP 3ad: embedding update information (sezione .upd_info)
          if [ -n "${UPDATEINFO}" ] && ! grep -aq "gh-releases-zsync|" "${OUT}"; then
            echo "❌ update information non trovata nell'AppImage (embedding fallito?)"
            exit 1
          fi
          # STEP 3ad: .zsync per gli aggiornamenti delta (AppImageUpdate).
          # appimagetool ha gia' generato un .zsync con URL RELATIVO: lo si
          # RIGENERA con zsyncmake e URL assoluto canonico (formato classico
          # full-file, compatibile con AppImageUpdate/zsync2).
          if [ -n "${UPDATEINFO}" ]; then
            CANONICAL_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${CURRENT_TAG}/RiPlay-${CURRENT_TAG}-Linux-x86_64.AppImage"
            ZDIR="composeApp/build/compose/binaries/appimage"
            echo "🔗 zsyncmake -u ${CANONICAL_URL}"
            ( cd "${ZDIR}" && zsyncmake -u "${CANONICAL_URL}" "RiPlay-Linux-x86_64.AppImage" )
            ZSYNC="${ZDIR}/RiPlay-Linux-x86_64.AppImage.zsync"
            zsize=$(stat -c%s "${ZSYNC}")
            echo "📦 ${ZSYNC}: ${zsize} bytes"
            if [ "${zsize}" -lt 51200 ]; then
              echo "❌ .zsync sospettosamente piccolo (<50KB)"
              exit 1
            fi
            zurl=$(grep -a '^URL:' "${ZSYNC}" | head -1 | cut -d' ' -f2-)
            echo "🔎 URL nel .zsync: ${zurl}"
            if [ "${zurl}" != "${CANONICAL_URL}" ]; then
              echo "❌ URL nel .zsync diverso dall'URL canonico atteso"
              exit 1
            fi
          fi
          echo "✅ AppImage costruita: ${OUT}"

      # STEP 3ab: Architettura su macOS verifica che il binario
      # dell'app (e il runtime bundlato da jpackage) sia dell'arch attesa
      # della matrix (arm64 su macos-15, x86_64 su macos-15-intel): se il
      # runner sbagliasse arch la build muore qui con log chiaro.
      - name: Controllo architettura app image (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          EXPECT="${{ matrix.expect_arch }}"
          APP_DIR=$(find composeApp/build/compose/binaries/main -maxdepth 2 -name 'RiPlay.app' -type d 2>/dev/null | head -1)
          if [ -z "$APP_DIR" ]; then
            echo "❌ RiPlay.app non trovata in binaries/main:"
            find composeApp/build/compose/binaries -maxdepth 4 || true
            exit 1
          fi
          BIN="$APP_DIR/Contents/MacOS/RiPlay"
          archs=$(lipo -archs "$BIN")
          echo "🔎 $BIN -> [$archs]"
          case "$archs" in
            *"$EXPECT"*) echo "✅ architettura attesa ($EXPECT) presente" ;;
            *) echo "❌ architettura attesa ($EXPECT) ASSENTE in [$archs]"; exit 1 ;;
          esac
          JLI="$APP_DIR/Contents/runtime/lib/libjli.dylib"
          if [ -e "$JLI" ]; then
            jarch=$(lipo -archs "$JLI")
            echo "🔎 runtime bundlato: $JLI -> [$jarch]"
            case "$jarch" in
              *"$EXPECT"*) echo "✅ runtime jpackage dell'arch attesa ($EXPECT)" ;;
              *) echo "⚠️ runtime jpackage [$jarch] diverso dall'attesa ($EXPECT) (non bloccante)" ;;
            esac
          else
            echo "⚠️ libjli.dylib non trovata in $APP_DIR/Contents/runtime/lib (skip check runtime)"
          fi

      # STEP 3u: se macOS fallisce non voliamo più al buio -> stampiamo gli
      # argomenti esatti di jpackage e il Info.plist generato, e li alleghiamo
      # come artifact per l'analisi
      - name: Diagnostica jpackage (solo su fallimento macOS)
        if: failure() && runner.os == 'macOS'
        shell: bash
        run: |
          D=composeApp/build/compose/tmp
          {
            echo "=== createDistributable.args.txt ==="
            cat "$D/createDistributable.args.txt" 2>/dev/null || echo "(assente)"
            echo ""
            echo "=== packageDmg.args.txt ==="
            cat "$D/packageDmg.args.txt" 2>/dev/null || echo "(assente)"
            echo ""
            echo "=== Info.plist generati ==="
            find "$D" -maxdepth 3 -name '*.plist' -type f 2>/dev/null | while read -r p; do
              echo "--- $p ---"
              cat "$p"
              echo ""
            done
            echo "=== build/compose/tmp (livello 1) ==="
            ls -la "$D" 2>/dev/null || true
            echo "=== binaries ==="
            find composeApp/build/compose/binaries -maxdepth 3 2>/dev/null | head -40 || true
          } > jpackage-diagnostics.txt 2>&1 || true
          cat jpackage-diagnostics.txt

      - name: Upload diagnostica jpackage (macOS)
        if: failure() && runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: macos-jpackage-diagnostics-${{ matrix.name }}
          path: jpackage-diagnostics.txt
          if-no-files-found: ignore
          retention-days: 7

      # STEP 3y: staging PIATTO dei pacchetti desktop (jpackage + AppImage,
      # STEP 3ac). upload-artifact@v4 con
      # piu' search path usa come root dell'artifact il "least common ancestor
      # of all the search paths": passando i 4 glob sotto binaries/main/ il
      # root era binaries/main/ e i pacchetti arrivavano ANNIDATI (msi/...,
      # deb/...) dentro l'artifact -> il job release non li trovava e non
      # allegava nulla alla release. Con UNA sola directory piatta il root e'
      # la directory stessa e i file arrivano alla radice dell'artifact.
      - name: Raccogli pacchetti prodotti (staging piatto)
        shell: bash
        run: |
          set -u
          mkdir -p desktop-packages
          # STEP 3ac: aggiunto '*.AppImage' (prodotta in binaries/appimage/)
          find composeApp/build/compose/binaries -type f \( -name '*.msi' -o -name '*.deb' -o -name '*.rpm' -o -name '*.dmg' -o -name '*.AppImage' -o -name '*.zsync' \) -print -exec cp {} desktop-packages/ \;
          echo "📦 Pacchetti raccolti in desktop-packages/:"
          ls -lah desktop-packages/
          n=$(ls -1 desktop-packages | wc -l)
          if [ "$n" -eq 0 ]; then
            echo "❌ jpackage non ha prodotto nessun pacchetto: albero binaries:"
            find composeApp/build/compose/binaries -maxdepth 4 || true
            exit 1
          fi
          # Assert per-OS: ogni runner DEVE produrre la sua estensione
          case "${RUNNER_OS}" in
            Windows) exts="msi" ;;
            Linux)   exts="deb rpm AppImage zsync" ;;
            macOS)   exts="dmg" ;;
            *)       exts="" ;;
          esac
          for ext in $exts; do
            if ls desktop-packages/*."$ext" >/dev/null 2>&1; then
              echo "✅ *.${ext} presente (runner ${RUNNER_OS})"
            else
              echo "❌ MANCA *.${ext} atteso sul runner ${RUNNER_OS}"
              exit 1
            fi
          done

      # Root piatta garantita: un solo search path = niente LCA/annidamenti
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          if-no-files-found: error
          path: desktop-packages/*
          retention-days: 1

  # ===========================================================================
  # 4) RELEASE: raccoglie TUTTI gli artifact (android + desktop), aggiunge gli
  #    archivi 7z AVD/WSA/WAYDROID e pubblica UNA release con changelog
  # ===========================================================================
  release:
    needs: [validate, build-apk, build-desktop]
    # Va avanti anche se uno dei due gruppi e' stato SALTATO (dispatch
    # android-only/desktop-only), ma non se qualcuno e' fallito/cancellato
    if: >-
      always() &&
      needs.validate.result == 'success' &&
      needs.build-apk.result != 'failure' &&
      needs.build-apk.result != 'cancelled' &&
      needs.build-desktop.result != 'failure' &&
      needs.build-desktop.result != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Ogni artifact finisce in una SUA sottocartella (niente merge: evita di
      # mischiare apk full/foss e pacchetti di sistemi diversi)
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Normalize asset names
        env:
          CURRENT_TAG: ${{ needs.validate.outputs.version }}
        run: |
          cd release-assets
          echo "📂 Artifacts scaricati:"
          find . -type f | sort

          # Nomi canonici per la release (se un artifact contiene piu' file
          # con la stessa estensione, vengono numerati -1, -2, ...)
          rename_artifact() { # $1=artifact_dir $2=extension $3=base canonico
            local files n i=1 f
            files=$(ls "$1"/*."$2" 2>/dev/null || true)
            [ -z "$files" ] && return 0
            n=$(echo "$files" | wc -l)
            for f in $files; do
              if [ "$n" -eq 1 ]; then
                cp "$f" "${3}.${2}"
              else
                cp "$f" "${3}-${i}.${2}"
              fi
              i=$((i+1))
            done
          }
          rename_artifact apk-full       apk "RiPlay-${CURRENT_TAG}-Android-full"
          rename_artifact apk-foss       apk "RiPlay-${CURRENT_TAG}-Android-foss"
          rename_artifact windows-msi    msi "RiPlay-${CURRENT_TAG}-Windows"
          rename_artifact linux-deb-rpm  deb "RiPlay-${CURRENT_TAG}-Linux"
          rename_artifact linux-deb-rpm  rpm "RiPlay-${CURRENT_TAG}-Linux"
          rename_artifact linux-deb-rpm  AppImage "RiPlay-${CURRENT_TAG}-Linux-x86_64"
          rename_artifact linux-deb-rpm  AppImage.zsync "RiPlay-${CURRENT_TAG}-Linux-x86_64"
          rename_artifact macos-dmg      dmg "RiPlay-${CURRENT_TAG}-macOS-arm64"
          rename_artifact macos-dmg-x64  dmg "RiPlay-${CURRENT_TAG}-macOS-x86_64"

          echo "📂 Dopo rinomina:"
          find . -maxdepth 1 -type f | sort

      # STEP 3y: verifica GLI ASSET ATTESI prima di creare la release. Finora
      # un asset mancante passava inosservato (glob senza match ignorati in
      # silenzio): ora l'elenco atteso e' esplicito e il job muore con un
      # ::error:: che dice COSA manca (consapevole dei targets scelti)
      - name: Verifica asset attesi prima della release
        env:
          CURRENT_TAG: ${{ needs.validate.outputs.version }}
          TARGETS: ${{ needs.validate.outputs.targets }}
        run: |
          cd release-assets
          echo "=== Inventario artifact scaricati (2 livelli) ==="
          find . -mindepth 1 -maxdepth 2 | sort
          missing=0
          check() { # $1=pattern glob $2=descrizione
            if ls -1 $1 >/dev/null 2>&1; then
              echo "✅ $2: $(ls -1 $1 | tr '\n' ' ')"
            else
              echo "❌ $2: MANCANTE (pattern: $1)"
              missing=$((missing+1))
            fi
          }
          case "$TARGETS" in
            android-only)
              check "RiPlay-${CURRENT_TAG}-Android-full*.apk" "APK full"
              check "RiPlay-${CURRENT_TAG}-Android-foss*.apk" "APK foss"
              ;;
            desktop-only)
              check "RiPlay-${CURRENT_TAG}-Windows*.msi" "MSI Windows"
              check "RiPlay-${CURRENT_TAG}-Linux*.deb"   "DEB Linux"
              check "RiPlay-${CURRENT_TAG}-Linux*.rpm"   "RPM Linux"
              check "RiPlay-${CURRENT_TAG}-Linux-x86_64*.AppImage" "AppImage Linux x86_64"
              check "RiPlay-${CURRENT_TAG}-Linux-x86_64*.AppImage.zsync" "ZSync AppImage (update delta)"
              check "RiPlay-${CURRENT_TAG}-macOS-arm64*.dmg"   "DMG macOS Apple Silicon"
              check "RiPlay-${CURRENT_TAG}-macOS-x86_64*.dmg"  "DMG macOS Intel"
              ;;
            *) # all (push tag o dispatch 'all')
              check "RiPlay-${CURRENT_TAG}-Android-full*.apk" "APK full"
              check "RiPlay-${CURRENT_TAG}-Android-foss*.apk" "APK foss"
              check "RiPlay-${CURRENT_TAG}-Windows*.msi" "MSI Windows"
              check "RiPlay-${CURRENT_TAG}-Linux*.deb"   "DEB Linux"
              check "RiPlay-${CURRENT_TAG}-Linux*.rpm"   "RPM Linux"
              check "RiPlay-${CURRENT_TAG}-Linux-x86_64*.AppImage" "AppImage Linux x86_64"
              check "RiPlay-${CURRENT_TAG}-Linux-x86_64*.AppImage.zsync" "ZSync AppImage (update delta)"
              check "RiPlay-${CURRENT_TAG}-macOS-arm64*.dmg"   "DMG macOS Apple Silicon"
              check "RiPlay-${CURRENT_TAG}-macOS-x86_64*.dmg"  "DMG macOS Intel"
              ;;
          esac
          echo "Asset attesi mancanti: ${missing}"
          if [ "$missing" -gt 0 ]; then
            echo "::error::STEP 3y: asset attesi mancanti in release-assets — la release NON verra' creata incompleta. Vedi l'inventario sopra."
            exit 1
          fi

      - name: Package desktop distribution as 7z
        env:
          CURRENT_TAG: ${{ needs.validate.outputs.version }}
        run: |
          echo "📦 Installing 7zip..."
          sudo apt-get install -y p7zip-full

          AVD_ARCHIVE="RiPlay-desktop-AVD-${CURRENT_TAG}.7z"
          WSA_ARCHIVE="RiPlay-desktop-WSA-${CURRENT_TAG}.7z"
          WAYDROID_ARCHIVE="RiPlay-desktop-WAYDROID-${CURRENT_TAG}.7z"

          # Con guard: se una sorgente non esiste nella repo si salta l'archivio
          # invece di far fallire tutto il job release
          if [ -d desktopDistribution/src/avd ]; then
            echo "📦 Creating ${AVD_ARCHIVE} (Windows & Linux) from desktopDistribution/src/avd/ ..."
            7z a "release-assets/${AVD_ARCHIVE}" ./desktopDistribution/src/avd/*
          else
            echo "⚠️  desktopDistribution/src/avd non presente: ${AVD_ARCHIVE} saltato"
          fi

          if [ -d desktopDistribution/src/wsa ]; then
            echo "📦 Creating ${WSA_ARCHIVE} (Windows only) from desktopDistribution/src/wsa/ ..."
            7z a "release-assets/${WSA_ARCHIVE}" ./desktopDistribution/src/wsa/*
          else
            echo "⚠️  desktopDistribution/src/wsa non presente: ${WSA_ARCHIVE} saltato"
          fi

          if [ -d desktopDistribution/src/waydroid ]; then
            echo "📦 Creating ${WAYDROID_ARCHIVE} (Linux only) from desktopDistribution/src/waydroid/ ..."
            7z a "release-assets/${WAYDROID_ARCHIVE}" ./desktopDistribution/src/waydroid/*
          else
            echo "⚠️  desktopDistribution/src/waydroid non presente: ${WAYDROID_ARCHIVE} saltato"
          fi

          echo "📂 Final content of folder release-assets (root):"
          find release-assets -maxdepth 1 -type f -exec du -h {} \; | sort -k2

      # STEP 3y: elenco DINAMICO e concreto dei file da allegare (solo file
      # realmente presenti in release-assets/): niente glob statici che
      # possono non matchare nulla in silenzio; con fail_on_unmatched_files
      # ogni anomalia fallirebbe comunque alla vista
      - name: Prepara elenco file per la release
        run: |
          LIST=$(find release-assets -maxdepth 1 -type f | sort)
          echo "📂 File che verranno allegati alla release:"
          echo "$LIST"
          {
            echo "RELEASE_FILES<<RFILES_EOF"
            echo "$LIST"
            echo "RFILES_EOF"
          } >> "$GITHUB_ENV"

      - name: Generate Changelog
        env:
          CURRENT_TAG: ${{ needs.validate.outputs.version }}
        run: |
          PREVIOUS_TAG=$(git tag --sort=-version:refname --list "v*" --merged HEAD | grep -v "^${CURRENT_TAG}$" | head -1)

          if [ -z "$PREVIOUS_TAG" ]; then
            echo "⚠️  No previous tag found - showing all commits"
            # 🔧 FIX: GITHUB_REPOSITORY è una env di default; || true evita fallimento
            # se grep filtra tutte le righe
            git log --pretty=format:"- %s ([%h](https://github.com/${GITHUB_REPOSITORY}/commit/%H))" --reverse \
              | grep -v "Update stats and chart \[skip ci\]" | head -20 > /tmp/changelog.txt || true
          else
            echo "📋 Changes between $PREVIOUS_TAG and $CURRENT_TAG"
            git log "${PREVIOUS_TAG}..HEAD" --pretty=format:"- %s ([%h](https://github.com/${GITHUB_REPOSITORY}/commit/%H))" \
              | grep -v "Update stats and chart \[skip ci\]" > /tmp/changelog.txt || true
          fi

          echo "" >> /tmp/changelog.txt

      - name: Create Release Notes
        env:
          CURRENT_TAG: ${{ needs.validate.outputs.version }}
        run: |
          RELEASE_DATE=$(date +'%Y-%m-%d')
          COMMIT_HASH=$(git rev-parse --short HEAD)

          {
            echo "## 🎵 RiPlay ${CURRENT_TAG} - Released ${RELEASE_DATE}"
            echo ""
            echo "### 📋 What's Changed"
            # Il changelog viene letto da file: bash non interpreta
            # virgolette, backtick o parentesi nei messaggi di commit
            cat /tmp/changelog.txt
            echo ""
            echo "### 📦 Downloads"
            echo "**Android**"
            echo "- **APK Full** (all features)"
            echo "- **APK FOSS** (all features less chromecast, check for updates, musicvault)"
            echo ""
            echo "**Native Desktop** (CEF included, no download; VLC required for local files)"
            echo "- **Windows** - MSI installer"
            echo "- **Linux** - DEB + RPM + AppImage (portatile x86_64)"
            echo "  - AppImage: `chmod +x RiPlay-*.AppImage` and run (static runtime: no libfuse2 required; fallback if FUSE unavailable: ./RiPlay-*.AppImage --appimage-extract-and-run)"
            echo "  - Delta updates: file .zsync for AppImageUpdate (appimageupdate RiPlay-*.AppImage)"
            echo "- **macOS Apple Silicon** - DMG (not signed: first run with right mouse button -> open)"
            echo "- **macOS Intel** - DMG (not signed: first run with right mouse button -> open)"
            echo ""
            echo "**Desktop Android-based distributions** (7z)"
            echo "- **Desktop AVD** (Windows & Linux)"
            echo "- **Desktop WSA** (Windows only)"
            echo "- **Desktop WAYDROID** (Linux only)"
            echo ""
            echo "### ✨ Build Information"
            echo "- **Build Date**: ${RELEASE_DATE}"
            echo "- **Git Commit**: \`${COMMIT_HASH}\`"
            echo "- **Java Version**: 21"
            echo ""
            echo "**Thank you for using RiPlay!** 🎵"
          } > /tmp/release_notes.md

      # STEP 3y: action-gh-release v1 -> v3 (v1 non manutenuta; v3 gestisce
      # overwrite_files per i re-run sullo stesso tag). files = elenco concreto
      # e dinamico preparato dallo step precedente; fail_on_unmatched_files
      # rende impossibile creare una release con asset mancanti in silenzio
      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          files: ${{ env.RELEASE_FILES }}
          fail_on_unmatched_files: true
          overwrite_files: true
          body_path: /tmp/release_notes.md
          draft: false
          prerelease: false
          tag_name: ${{ needs.validate.outputs.version }}
          token: ${{ secrets.GITHUB_TOKEN }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Summary
        if: success()
        run: |
          echo "✅ Release completed successfully!"
          echo "📦 Release files:"
          find release-assets -maxdepth 1 -type f -exec du -h {} \; | sort -k2
