<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <!-- Sblocca i DNS e i canali TCP prima che JS inizi a computare -->
  <link rel="preconnect" href="https://youtube.com">
  <link rel="preconnect" href="https://rr---sn-*.googlevideo.com">
  <link rel="dns-prefetch" href="https://ytimg.com">

  <style>
    html, body {
        height: 100%;
        width: 100%;
        margin: 0;
        padding: 0;
        background-color: #000000;
        overflow: hidden;
        position: relative;
    }

    /* Il wrapper fa da ghigliottina fissa sullo schermo del telefono */
    .iframe-cropper-wrapper {
        width: 100%;
        height: 100%;
        overflow: hidden;
        position: relative;
    }

    /* Configurazione base dell'IFrame agganciata alla GPU */
    #youTubePlayerDOM {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        will-change: transform;
        /* Mantiene il centro perfetto per la trasformazione geometrica */
        transform-origin: center center;
        transition: transform 0.2s ease;
    }

    /* ========================================================================= */
    /* CONFIGURAZIONE PORTRAIT (SCHERMO VERTICALE)                               */
    /* ========================================================================= */
    @media (orientation: portrait) {
        #youTubePlayerDOM {
            /* Ingrandiamo l'IFrame dell'8% (1.08) o del 10% (1.10) a seconda del telefono. */
            /* Questo spinge i 5 pixel alti e bassi FUORI dallo schermo in modo simmetrico! */
            transform: scale(1.10) translateZ(0);
        }
    }

    /* ========================================================================= */
    /* CONFIGURAZIONE LANDSCAPE (SCHERMO ORIZZONTALE)                            */
    /* ========================================================================= */
    @media (orientation: landscape) {
        #youTubePlayerDOM {
            /* Visto che in Landscape i tuoi parametri erano già perfetti, */
            /* usiamo la traslazione classica che avevi validato con successo */
            transform: scale(1.0) translateZ(0); /* Resetta lo scale */
            top: -42px;
            height: calc(100% + 90px);
        }
    }

    #customPoster {
          position: absolute;
          top: 0; left: 0; width: 100%; height: 100%;
          background-color: #000000;
          background-repeat: no-repeat;
          background-position: center;
          /* FONDAMENTALE: mantiene le proporzioni sferiche in Portrait e Landscape! */
          background-size: contain;
          z-index: 10;
          pointer-events: none; /* Non blocca i tocchi utente */
          transition: opacity 0.3s ease; /* Scomparsa fluida all'avvio */
          opacity: 1;
      }

  </style>

  <!-- 'defer' impedisce race condition durante il parsing dell'API ufficiale -->
  <script defer src="https://youtube.com/iframe_api"></script>
</head>

<body>
<!-- Il poster sta sopra al player di YouTube -->
<div id="customPoster"></div>
<!-- Incapsuliamo l'IFrame nel wrapper di ritaglio -->
<div class="iframe-cropper-wrapper">
  <div id="youTubePlayerDOM"></div>
</div>
</body>

<script>
  // Costanti di Stato
  const UNSTARTED = "UNSTARTED";
  const ENDED = "ENDED";
  const PLAYING = "PLAYING";
  const PAUSED = "PAUSED";
  const BUFFERING = "BUFFERING";
  const CUED = "CUED";

  var YouTubePlayerBridge = window.YouTubePlayerBridge;
  var player;
  var timerId;
  var adblockIntervalId;

  // Funzione AdBlock protetta da eccezioni Cross-Origin
  function initializeAdBlock() {
    if (adblockIntervalId) clearInterval(adblockIntervalId);

    const playerIFrame = document.querySelector("iframe");
    if (!playerIFrame) return;

    adblockIntervalId = setInterval(() => {
      try {
        const frameDoc = playerIFrame.contentDocument || playerIFrame.contentWindow.document;
        if (!frameDoc) return;

        const adsContainer = frameDoc.querySelector('.video-ads');
        if (adsContainer && adsContainer.childElementCount > 0) {
          const adsVideo = adsContainer.querySelector("video");
          if (adsVideo) {
            adsVideo.muted = true;
            adsVideo.style.display = 'none';
            adsVideo.currentTime = adsVideo.duration - 0.15;
            adsVideo.muted = false;
            adsVideo.style.display = '';
            clearInterval(adblockIntervalId);
          }
        } else if (frameDoc.getElementsByClassName('ad-showing').length > 0) {
          const mainVideo = frameDoc.querySelector('.html5-main-video');
          if (mainVideo) {
            mainVideo.muted = true;
            mainVideo.currentTime = mainVideo.duration - 0.15;
            mainVideo.muted = false;
            clearInterval(adblockIntervalId);
          }
        }
      } catch (e) {
        // Sicurezza CORS: Se la WebView blocca l'accesso cross-origin al DOM dell'iframe,
        // fermiamo l'intervallo per evitare di sprecare CPU in loop infiniti
        clearInterval(adblockIntervalId);
      }
    }, 200);
  }

  // Callback ufficiale delle API di YouTube
  function onYouTubeIframeAPIReady() {
    if (YouTubePlayerBridge && typeof YouTubePlayerBridge.sendYouTubeIFrameAPIReady === 'function') {
       YouTubePlayerBridge.sendYouTubeIFrameAPIReady();
    }

    player = new YT.Player('youTubePlayerDOM', {
      height: '100%',
      width:  '100%',
      events: {
        onReady: function(event) {
          if (YouTubePlayerBridge && typeof YouTubePlayerBridge.sendReady === 'function') {
              YouTubePlayerBridge.sendReady();
          }

          // WORKAROUND DEFINITIVO VOLUME non è detto che funzioni (Mute/Unmute/SetVolume)
          // 6 controlli distanziati ogni 300ms coprono circa 1.8 secondi (la finestra critica)
          var checks = 0;
          var audioInterval = setInterval(function() {
              if (player && typeof player.unMute === 'function') {
                  player.unMute();
                  player.setVolume(100);
              }
              checks++;
              if (checks >= 6) {
                  clearInterval(audioInterval);
              }
          }, 300);
        },
        onStateChange: function(event) { sendPlayerStateChange(event.data) },
        onPlaybackQualityChange: function(event) { if(YouTubePlayerBridge) YouTubePlayerBridge.sendPlaybackQualityChange(event.data) },
        onPlaybackRateChange: function(event) { if(YouTubePlayerBridge) YouTubePlayerBridge.sendPlaybackRateChange(event.data) },
        onError: function(error) { if(YouTubePlayerBridge) YouTubePlayerBridge.sendError(error.data) },
        onApiChange: function(event) { if(YouTubePlayerBridge) YouTubePlayerBridge.sendApiChange() }
      },
      playerVars: <<injectedPlayerVars>>
    });
  }

  function sendPlayerStateChange(playerState) {
    clearTimeout(timerId);
    initializeAdBlock();

    if (!YouTubePlayerBridge) return;

    var poster = document.getElementById('customPoster');

    switch (playerState) {
      case YT.PlayerState.UNSTARTED:
        YouTubePlayerBridge.sendStateChange(UNSTARTED);
        sendVideoIdFromPlaylistIfAvailable(player);
        return;
      case YT.PlayerState.ENDED:
        YouTubePlayerBridge.sendStateChange(ENDED);
        return;
      case YT.PlayerState.PLAYING:
        // Il poster custom svanisce subito all'avvio dell'audio
        if (poster) {
            poster.style.opacity = '0';
            setTimeout(function() { poster.style.display = 'none'; }, 400);
        }

        YouTubePlayerBridge.sendStateChange(PLAYING);
        startSendCurrentTimeInterval();
        sendVideoData(player);
        return;
      case YT.PlayerState.PAUSED:
        YouTubePlayerBridge.sendStateChange(PAUSED);
        return;
      case YT.PlayerState.BUFFERING:
        YouTubePlayerBridge.sendStateChange(BUFFERING);
        return;
      case YT.PlayerState.CUED:
        YouTubePlayerBridge.sendStateChange(CUED);
        return;
    }
  }

  function sendVideoData(player) {
    if (player && typeof player.getDuration === 'function' && YouTubePlayerBridge) {
       YouTubePlayerBridge.sendVideoDuration(player.getDuration());
    }
  }

  function sendVideoIdFromPlaylistIfAvailable(player) {
    if (!player || !YouTubePlayerBridge) return;
    var playlist = player.getPlaylist();
    if (typeof playlist !== 'undefined' && Array.isArray(playlist) && playlist.length > 0) {
      var index = player.getPlaylistIndex();
      YouTubePlayerBridge.sendVideoId(playlist[index]);
    }
  }

  function startSendCurrentTimeInterval() {
    timerId = setInterval(function() {
      if (player && typeof player.getCurrentTime === 'function' && YouTubePlayerBridge) {
        YouTubePlayerBridge.sendVideoCurrentTime(player.getCurrentTime());
        YouTubePlayerBridge.sendVideoLoadedFraction(player.getVideoLoadedFraction());
      }
    }, 100);
  }

  // Interfaccia di comunicazione: invocata nativamente da KOTLIN

  function seekTo(startSeconds) { if(player) player.seekTo(startSeconds, true); }
  function pauseVideo() { if(player) player.pauseVideo(); }
  function playVideo() { if(player) player.playVideo(); }

  function loadVideo(videoId, startSeconds) {
    if(player) {
       player.loadVideoById(videoId, startSeconds);
       if(YouTubePlayerBridge) YouTubePlayerBridge.sendVideoId(videoId);
    }
  }

  function cueVideo(videoId, startSeconds) {
    if(player) {
       player.cueVideoById(videoId, startSeconds);
       if(YouTubePlayerBridge) YouTubePlayerBridge.sendVideoId(videoId);
    }
  }

  function mute() { if(player) player.mute(); }
  function unMute() { if(player) player.unMute(); }
  function setVolume(volumePercent) { if(player) player.setVolume(volumePercent); }
  function setPlaybackRate(playbackRate) { if(player) player.setPlaybackRate(playbackRate); }
  function toggleFullscreen() { if(player) player.toggleFullscreen(); }
  function nextVideo() { if(player) player.nextVideo(); }
  function previousVideo() { if(player) player.previousVideo(); }
  function playVideoAt(index) { if(player) player.playVideoAt(index); }
  function setLoop(loop) { if(player) player.setLoop(loop); }
  function setShuffle(shuffle) { if(player) player.setShuffle(shuffle); }
</script>
</html>
