<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <!-- Sblocca i DNS e i canali TCP prima che JS inizi a computare -->
  <link rel="preconnect" href="https://youtube.com">
  <link rel="preconnect" href="https://rr---sn-*.googlevideo.com">
  <link rel="dns-prefetch" href="https://ytimg.com">

  <style>
    html, body {
        height: 100%;
        width: 100%;
        margin: 0;
        padding: 0;
        background-color: #000000;
        overflow: hidden;
        position: relative;
    }

    /* Il wrapper fa da ghigliottina fissa sullo schermo del telefono */
    .iframe-cropper-wrapper {
        width: 100%;
        height: 100%;
        overflow: hidden;
        position: relative;
    }

    .yt-deck {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
    }

    .yt-deck-active {
        opacity: 1;
        z-index: 2;
        pointer-events: auto;
    }

    .yt-deck-standby {
        opacity: 0;
        z-index: 1;
        pointer-events: none;
    }

    /* Configurazione base dell'IFrame agganciata alla GPU */
    #youTubePlayerDOM, #youTubePlayerDOMStandby {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        will-change: transform;
        /* Mantiene il centro perfetto per la trasformazione geometrica */
        transform-origin: center center;
        transition: transform 0.2s ease;
    }

    #customPoster {
          position: absolute;
          top: 0; left: 0; width: 100%; height: 100%;
          background-color: #000000;
          background-repeat: no-repeat;
          background-position: center;
          /* FONDAMENTALE: mantiene le proporzioni sferiche in Portrait e Landscape! */
          background-size: contain;
          z-index: 10;
          pointer-events: none; /* Non blocca i tocchi utente */
          transition: opacity 0.3s ease; /* Scomparsa fluida all'avvio */
          opacity: 1;
      }

  </style>

  <!-- 'defer' impedisce race condition durante il parsing dell'API ufficiale -->
  <script defer src="https://youtube.com/iframe_api"></script>
</head>

<body>
<!-- Il poster sta sopra al player di YouTube -->
<div id="customPoster"></div>
<!-- Incapsuliamo i due deck IFrame nel wrapper di ritaglio per pre-buffering e crossfade reale -->
<div class="iframe-cropper-wrapper">
  <div id="deckWrapper0" class="yt-deck yt-deck-active">
    <div id="youTubePlayerDOM"></div>
  </div>
  <div id="deckWrapper1" class="yt-deck yt-deck-standby">
    <div id="youTubePlayerDOMStandby"></div>
  </div>
</div>
</body>

<script>
  // Costanti di Stato
  const UNSTARTED = "UNSTARTED";
  const ENDED = "ENDED";
  const PLAYING = "PLAYING";
  const PAUSED = "PAUSED";
  const BUFFERING = "BUFFERING";
  const CUED = "CUED";

  var YouTubePlayerBridge = window.YouTubePlayerBridge;
  var player;
  var decks = [null, null];
  var deckReady = [false, false];
  var activeDeckIndex = 0;
  var standbyCued = null;      // {videoId, startSeconds, state, prebuffered, at}
  var pendingPreload = null;   // {videoId, startSeconds}
  var cuedStartFallbackTimer = null;
  var desiredPlaybackRate = 1;
  var primaryReadySent = false;

  // Stato crossfade sovrapposto sincronizzato (dual-deck overlap mixer)
  var crossfadeTimer = null;
  var outgoingFadeDeckIdx = -1;
  var incomingFadeDeckIdx = -1;
  var incomingFadeVideoId = null;
  var incomingFadeCurrentVol = 100;

  var timerId = null;
  var lastSentDuration = 0;
  var adblockIntervalId;
  var volumeWatchdogInterval = null;
  var desiredVolume = 100;

  // WatchDog per UNSTARTED
  var lastLoadRequest = null;
  var unstartedRetryDone = false;
  var lastCueRequest = null;   // {videoId, startSeconds} settato in cueVideo()

  function getActiveDeckWrapper() {
    return document.getElementById(activeDeckIndex === 0 ? 'deckWrapper0' : 'deckWrapper1');
  }

  function syncDeckWrapperClasses() {
    var w0 = document.getElementById('deckWrapper0');
    var w1 = document.getElementById('deckWrapper1');
    if (!w0 || !w1) return;
    if (activeDeckIndex === 0) {
      w0.className = 'yt-deck yt-deck-active';
      w1.className = 'yt-deck yt-deck-standby';
    } else {
      w0.className = 'yt-deck yt-deck-standby';
      w1.className = 'yt-deck yt-deck-active';
    }
  }

  // Funzione AdBlock protetta da eccezioni Cross-Origin
  function initializeAdBlock() {
    if (adblockIntervalId) clearInterval(adblockIntervalId);

    var activeWrapper = getActiveDeckWrapper();
    var playerIFrame = activeWrapper ? activeWrapper.querySelector("iframe") : document.querySelector("iframe");
    if (!playerIFrame) return;

    adblockIntervalId = setInterval(() => {
      try {
        const frameDoc = playerIFrame.contentDocument || playerIFrame.contentWindow.document;
        if (!frameDoc) return;

        const adsContainer = frameDoc.querySelector('.video-ads');
        if (adsContainer && adsContainer.childElementCount > 0) {
          const adsVideo = adsContainer.querySelector("video");
          if (adsVideo) {
            adsVideo.muted = true;
            adsVideo.style.display = 'none';
            adsVideo.currentTime = adsVideo.duration - 0.15;
            adsVideo.muted = false;
            adsVideo.style.display = '';
            clearInterval(adblockIntervalId);
          }
        } else if (frameDoc.getElementsByClassName('ad-showing').length > 0) {
          const mainVideo = frameDoc.querySelector('.html5-main-video');
          if (mainVideo) {
            mainVideo.muted = true;
            mainVideo.currentTime = mainVideo.duration - 0.15;
            mainVideo.muted = false;
            clearInterval(adblockIntervalId);
          }
        }
      } catch (e) {
        // Sicurezza CORS: Se la WebView blocca l'accesso cross-origin al DOM dell'iframe,
        // fermiamo l'intervallo per evitare di sprecare CPU in loop infiniti
        clearInterval(adblockIntervalId);
      }
    }, 200);
  }

  function configureDeckAudioAndIframe(deckInstance, isStandby) {
    try {
      if (!deckInstance) return;
      if (typeof deckInstance.getIframe === 'function' && deckInstance.getIframe()) {
        deckInstance.getIframe().setAttribute("allow", "autoplay; encrypted-media");
      }
      if (isStandby) {
        if (typeof deckInstance.mute === 'function') deckInstance.mute();
        if (typeof deckInstance.setVolume === 'function') deckInstance.setVolume(0);
      } else {
        if (typeof deckInstance.unMute === 'function') deckInstance.unMute();
        if (typeof deckInstance.setVolume === 'function') deckInstance.setVolume(desiredVolume > 0 ? desiredVolume : 100);
      }
    } catch (e) {
      console.log("JS: Errore configurazione audio deck");
    }
  }

  function stopOutgoingDeckFadeOut(pauseOutgoing) {
    if (crossfadeTimer) {
      clearInterval(crossfadeTimer);
      crossfadeTimer = null;
    }
    if (outgoingFadeDeckIdx !== -1) {
      var outDeck = decks[outgoingFadeDeckIdx];
      var finishedOutIdx = outgoingFadeDeckIdx;
      outgoingFadeDeckIdx = -1;
      if (pauseOutgoing && outDeck && finishedOutIdx !== activeDeckIndex) {
        try {
          if (typeof outDeck.mute === 'function') outDeck.mute();
          if (typeof outDeck.setVolume === 'function') outDeck.setVolume(0);
          if (typeof outDeck.pauseVideo === 'function') outDeck.pauseVideo();
        } catch (e) {}
      }
    }
    if (incomingFadeDeckIdx !== -1) {
      var inDeck = decks[incomingFadeDeckIdx];
      incomingFadeDeckIdx = -1;
      incomingFadeVideoId = null;
      if (inDeck) {
        try {
          var targetVol = (desiredVolume > 0) ? desiredVolume : 100;
          if (typeof inDeck.unMute === 'function') inDeck.unMute();
          if (typeof inDeck.setVolume === 'function') inDeck.setVolume(targetVol);
        } catch (e) {}
      }
    }
    if (pendingPreload && outgoingFadeDeckIdx === -1 && incomingFadeDeckIdx === -1) {
      var req = pendingPreload;
      pendingPreload = null;
      preloadVideo(req.videoId, req.startSeconds);
    }
  }

  function startOutgoingDeckFadeOut(outDeck, outIdx, inDeck, inIdx, nextVideoId, durationMs, startVol) {
    stopOutgoingDeckFadeOut(false);
    if (!outDeck || !inDeck) return;

    outgoingFadeDeckIdx = outIdx;
    incomingFadeDeckIdx = inIdx;
    incomingFadeVideoId = nextVideoId;

    var maxVol = (startVol > 0) ? startVol : 100;
    incomingFadeCurrentVol = Math.max(20, Math.round(maxVol * 0.25));
    var startedAt = performance.now();

    try {
      if (typeof outDeck.unMute === 'function') outDeck.unMute();
      if (typeof outDeck.setVolume === 'function') outDeck.setVolume(maxVol);
      if (typeof inDeck.unMute === 'function') inDeck.unMute();
      if (typeof inDeck.setVolume === 'function') inDeck.setVolume(incomingFadeCurrentVol);
    } catch (e) {}

    console.log("AYP JS YT-BRIDGE: startOutgoingDeckFadeOut dual-deck mixer outDeck=" + outIdx + " inDeck=" + inIdx + " nextId=" + nextVideoId + " duration=" + durationMs + "ms startVol=" + maxVol);

    crossfadeTimer = setInterval(function() {
      var elapsed = performance.now() - startedAt;
      var progress = Math.min(1.0, elapsed / Math.max(500, durationMs));

      // Curva equal-power per l'ingresso (sale subito nel range udibile: 25% -> 71% a meta' -> 100%)
      var inVol = Math.min(maxVol, Math.max(20, Math.round(maxVol * Math.sqrt(progress))));
      // Curva morbida per l'uscita (100% -> 38% a meta' -> 0%)
      var outVol = Math.max(0, Math.round(maxVol * Math.pow(1.0 - progress, 1.4)));
      incomingFadeCurrentVol = inVol;

      try {
        if (typeof inDeck.unMute === 'function') inDeck.unMute();
        if (typeof inDeck.setVolume === 'function') inDeck.setVolume(inVol);
        if (typeof outDeck.setVolume === 'function') outDeck.setVolume(outVol);
      } catch (e) {}

      if (progress >= 1.0) {
        console.log("AYP JS YT-BRIDGE: dual-deck crossfade completed for nextId=" + nextVideoId);
        stopOutgoingDeckFadeOut(true);
      }
    }, 80);
  }

  function createDeckConfig(deckIdx, initialVideoId) {
    var cfg = {
      height: '100%',
      width:  '100%',
      events: {
        onReady: function(event) {
          deckReady[deckIdx] = true;
          var isStandby = (deckIdx !== activeDeckIndex);
          configureDeckAudioAndIframe(decks[deckIdx], isStandby);

          if (!isStandby && !primaryReadySent) {
            primaryReadySent = true;
            if (YouTubePlayerBridge && typeof YouTubePlayerBridge.sendReady === 'function') {
              YouTubePlayerBridge.sendReady();
            }

            var checks = 0;
            var audioInterval = setInterval(function() {
              if (player && typeof player.getVolume === 'function' && player.getVolume() === desiredVolume) {
                clearInterval(audioInterval);
                return;
              }
              if (player && typeof player.unMute === 'function' && typeof player.setVolume === 'function') {
                player.unMute();
                setVolume(desiredVolume);
              }
              checks++;
              if (checks >= 3) {
                clearInterval(audioInterval);
              }
            }, 250);

            // Rilevatore per UNSTARTED sempre attivo
            setInterval(function() {
              if (!player || !lastLoadRequest) return;
              if (player.getPlayerState() !== -1) return;
              var stuckFor = performance.now() - lastLoadRequest.at;
              var st = player.getPlayerState();
              if (stuckFor > 2000 && !unstartedRetryDone) {
                unstartedRetryDone = true;
                console.log("AYP JS YT-BRIDGE [RESCUE] state=" + st + " stuck=" + (stuckFor|0) + "ms -> re-issue " + lastLoadRequest.videoId);
                player.loadVideoById(lastLoadRequest.videoId, lastLoadRequest.startSeconds);
              }
            }, 500);
          } else if (isStandby && pendingPreload && outgoingFadeDeckIdx !== deckIdx && incomingFadeDeckIdx !== deckIdx) {
            var req = pendingPreload;
            pendingPreload = null;
            preloadVideo(req.videoId, req.startSeconds);
          }
        },
        onStateChange: function(event) {
          var st = event.data;
          var deckInstance = decks[deckIdx];

          // Se questo deck e' il deck entrante di un crossfade gia' avviato (prima dello swap UI),
          // NON metterlo in pausa: deve continuare a suonare e fare il fade-in!
          if (incomingFadeDeckIdx === deckIdx) {
            if (st === YT.PlayerState.PLAYING && deckInstance) {
              try {
                if (typeof deckInstance.unMute === 'function') deckInstance.unMute();
                if (typeof deckInstance.setVolume === 'function') deckInstance.setVolume(incomingFadeCurrentVol);
              } catch (e) {}
            }
            if (deckIdx === activeDeckIndex) {
              sendPlayerStateChange(st);
            }
            return;
          }

          if (deckIdx !== activeDeckIndex) {
            if (outgoingFadeDeckIdx === deckIdx) {
              if (st === YT.PlayerState.ENDED) {
                try {
                  if (deckInstance) {
                    if (typeof deckInstance.mute === 'function') deckInstance.mute();
                    if (typeof deckInstance.setVolume === 'function') deckInstance.setVolume(0);
                    if (typeof deckInstance.pauseVideo === 'function') deckInstance.pauseVideo();
                  }
                } catch (e) {}
              }
              return;
            }
            if (standbyCued) {
              standbyCued.state = st;
            }
            if (st === YT.PlayerState.PLAYING && deckInstance) {
              try {
                if (typeof deckInstance.mute === 'function') deckInstance.mute();
                if (typeof deckInstance.setVolume === 'function') deckInstance.setVolume(0);
                deckInstance.pauseVideo();
                if (standbyCued) {
                  standbyCued.prebuffered = true;
                  console.log("AYP JS YT-BRIDGE: standby deck=" + deckIdx + " prebuffered & paused at 0s id=" + standbyCued.videoId);
                }
              } catch (e) {}
            } else if (st === YT.PlayerState.PAUSED && standbyCued) {
              standbyCued.prebuffered = true;
            }
            return;
          }
          sendPlayerStateChange(st);
        },
        onPlaybackQualityChange: function(event) {
          if (deckIdx === activeDeckIndex && YouTubePlayerBridge) {
            YouTubePlayerBridge.sendPlaybackQualityChange(event.data);
          }
        },
        onPlaybackRateChange: function(event) {
          if (deckIdx === activeDeckIndex && YouTubePlayerBridge) {
            YouTubePlayerBridge.sendPlaybackRateChange(event.data);
          }
        },
        onError: function(error) {
          if (deckIdx !== activeDeckIndex && incomingFadeDeckIdx !== deckIdx) {
            standbyCued = null;
            return;
          }
          if (YouTubePlayerBridge) YouTubePlayerBridge.sendError(error.data);
        },
        onApiChange: function(event) {
          if (deckIdx === activeDeckIndex && YouTubePlayerBridge) {
            YouTubePlayerBridge.sendApiChange();
          }
        }
      },
      playerVars: <<injectedPlayerVars>>
    };

    if (initialVideoId) {
      cfg.videoId = initialVideoId;
    }
    return cfg;
  }

  // Callback ufficiale delle API di YouTube
  function onYouTubeIframeAPIReady() {
    if (YouTubePlayerBridge && typeof YouTubePlayerBridge.sendYouTubeIFrameAPIReady === 'function') {
       YouTubePlayerBridge.sendYouTubeIFrameAPIReady();
    }

    var initialVid = <<injectedVideoId>>;
    decks[0] = new YT.Player('youTubePlayerDOM', createDeckConfig(0, initialVid));
    decks[1] = new YT.Player('youTubePlayerDOMStandby', createDeckConfig(1, undefined));
    activeDeckIndex = 0;
    player = decks[0];
  }

  function stopCurrentTimeInterval() {
    if (timerId) {
      clearInterval(timerId);
      timerId = null;
    }
  }

  function sendPlayerStateChange(playerState) {
    stopCurrentTimeInterval();

    initializeAdBlock();

    if (!YouTubePlayerBridge) return;

    // MONITORAGGIO DEL VOLUME CON L'OBIETTIVO DI RIPORTARLO AL MASSIMO IN CASO SI ABBASSI IN MODO NON VOLUTO DALL'UTENTE
    if (playerState === YT.PlayerState.PLAYING) {
        if (cuedStartFallbackTimer) {
            clearTimeout(cuedStartFallbackTimer);
            cuedStartFallbackTimer = null;
        }
        try {
            if (player && typeof player.unMute === 'function') {
                player.unMute();
            }
            if (player && typeof player.setVolume === 'function' && incomingFadeDeckIdx !== activeDeckIndex) {
                player.setVolume(desiredVolume > 0 ? desiredVolume : 100);
            }
        } catch (e) {}

        if (volumeWatchdogInterval) {
            clearInterval(volumeWatchdogInterval);
        }

        volumeWatchdogInterval = setInterval(function() {
            if (crossfadeTimer) return;
            if (player && typeof player.getVolume === 'function') {
                var currentVol = player.getVolume();
                YouTubePlayerBridge.sendCurrentVolume(currentVol);
                if (currentVol !== desiredVolume) {
                    setVolume(desiredVolume);
                }
            }
        }, 4000);
    } else {
        if (volumeWatchdogInterval) {
            clearInterval(volumeWatchdogInterval);
            volumeWatchdogInterval = null;
        }
    }

    var poster = document.getElementById('customPoster');

    switch (playerState) {

      case YT.PlayerState.UNSTARTED:
        YouTubePlayerBridge.sendStateChange(UNSTARTED);
        return;
      case YT.PlayerState.ENDED:
        YouTubePlayerBridge.sendStateChange(ENDED);
        return;
      case YT.PlayerState.PLAYING:
        if (poster) {
            poster.style.opacity = '0';
            setTimeout(function() { poster.style.display = 'none'; }, 400);
        }

        YouTubePlayerBridge.sendStateChange(PLAYING);
        startSendCurrentTimeInterval();
        sendVideoData(player);
        return;
      case YT.PlayerState.PAUSED:
        YouTubePlayerBridge.sendStateChange(PAUSED);
        return;
      case YT.PlayerState.BUFFERING:
        if (cuedStartFallbackTimer) {
            clearTimeout(cuedStartFallbackTimer);
            cuedStartFallbackTimer = null;
        }
        YouTubePlayerBridge.sendStateChange(BUFFERING);
        return;
      case YT.PlayerState.CUED:
        YouTubePlayerBridge.sendStateChange(CUED);
        sendVideoData(player);
        return;
    }
  }

  function sendVideoData(player) {
    if (player && typeof player.getDuration === 'function' && YouTubePlayerBridge) {
       var dur = player.getDuration();
       if (dur && dur > 0) {
         lastSentDuration = dur;
         YouTubePlayerBridge.sendVideoDuration(dur);
       }
    }
  }

  function sendVideoIdFromPlaylistIfAvailable(player) {
    if (!player || !YouTubePlayerBridge) return;
    var playlist = player.getPlaylist();
    if (typeof playlist !== 'undefined' && Array.isArray(playlist) && playlist.length > 0) {
      var index = player.getPlaylistIndex();
      YouTubePlayerBridge.sendVideoId(playlist[index]);
    }
  }

  function sendCurrentVolume(player) {
    if (!player || !YouTubePlayerBridge) return;
    var volume = player.getVolume();
    if (typeof volume !== 'undefined') {
      YouTubePlayerBridge.sendCurrentVolume(volume);
    }
  }

  function startSendCurrentTimeInterval() {
    stopCurrentTimeInterval();
    timerId = setInterval(function() {
      if (player && typeof player.getCurrentTime === 'function' && YouTubePlayerBridge) {
        YouTubePlayerBridge.sendVideoCurrentTime(player.getCurrentTime());
        YouTubePlayerBridge.sendVideoLoadedFraction(player.getVideoLoadedFraction());
        if (typeof player.getDuration === 'function') {
          var dur = player.getDuration();
          if (dur && dur > 0 && Math.abs(dur - lastSentDuration) > 0.5) {
            lastSentDuration = dur;
            YouTubePlayerBridge.sendVideoDuration(dur);
          }
        }
      }
    }, 100);
  }

  // Interfaccia di comunicazione: invocata nativamente da KOTLIN

  function seekTo(startSeconds) {
    if(player) player.seekTo(startSeconds, true);
    console.log("AYP JS YT-BRIDGE: seekTo(" + startSeconds + ")");
  }

  function pauseVideo() {
    if (cuedStartFallbackTimer) {
      clearTimeout(cuedStartFallbackTimer);
      cuedStartFallbackTimer = null;
    }
    stopOutgoingDeckFadeOut(true);
    if(player) player.pauseVideo();
    console.log("AYP JS YT-BRIDGE: pauseVideo");
  }

  function playVideo() {
    if (player && typeof player.unMute === 'function') {
      player.unMute();
    }
    if (player && player.getPlayerState() === 5 && lastCueRequest) {
        console.log("AYP JS YT-BRIDGE: play su CUED -> load deterministico " + lastCueRequest.videoId);
        player.loadVideoById(lastCueRequest.videoId, lastCueRequest.startSeconds);
        return;
    }
    if (player) player.playVideo();
    console.log("AYP JS YT-BRIDGE: playVideo");
  }

  /**
   * Avvia IMMEDIATAMENTE il crossfade reale tra il deck attivo (che continua a suonare e sfuma a 0)
   * e il deck di standby (che fa partire subito nextVideoId e sale di volume con curva equal-power).
   * Quando poi Kotlin chiama loadVideo(nextVideoId, 0) al punto di crossover, il deck entrante e'
   * GIA' in riproduzione avanzata (~2s) e viene promosso a player attivo senza alcun restart a 0!
   */
  function startCrossfade(nextVideoId, durationMs) {
    if (!nextVideoId || !durationMs || durationMs <= 0) return;
    var outIdx = activeDeckIndex;
    var inIdx = 1 - activeDeckIndex;
    var outDeck = decks[outIdx];
    var inDeck = decks[inIdx];
    if (!outDeck || !inDeck || !deckReady[inIdx]) return;

    var startVol = (desiredVolume > 0) ? desiredVolume : 100;
    var isPreloaded = standbyCued && standbyCued.videoId === nextVideoId;
    var preCuedInfo = isPreloaded ? standbyCued : null;
    standbyCued = null;

    startOutgoingDeckFadeOut(outDeck, outIdx, inDeck, inIdx, nextVideoId, durationMs, startVol);

    if (desiredPlaybackRate !== 1 && typeof inDeck.setPlaybackRate === 'function') {
      try { inDeck.setPlaybackRate(desiredPlaybackRate); } catch (e) {}
    }

    if (preCuedInfo) {
      var st = (typeof inDeck.getPlayerState === 'function') ? inDeck.getPlayerState() : preCuedInfo.state;
      console.log("AYP JS YT-BRIDGE: startCrossfade starting prebuffered inDeck=" + inIdx + " state=" + st + " id=" + nextVideoId);
      if (st === 2 || st === 5 || preCuedInfo.prebuffered) {
        inDeck.playVideo();
        setTimeout(function() {
          if (incomingFadeDeckIdx !== inIdx || incomingFadeVideoId !== nextVideoId) return;
          var checkSt = (typeof inDeck.getPlayerState === 'function') ? inDeck.getPlayerState() : -1;
          if (checkSt !== 1 && checkSt !== 3) {
            console.log("AYP JS YT-BRIDGE: startCrossfade fallback -> loadVideoById id=" + nextVideoId);
            inDeck.loadVideoById(nextVideoId, 0);
          }
        }, 350);
      } else if (st !== 1 && st !== 3) {
        inDeck.loadVideoById(nextVideoId, 0);
      }
    } else {
      console.log("AYP JS YT-BRIDGE: startCrossfade cold loadVideoById on inDeck=" + inIdx + " id=" + nextVideoId);
      inDeck.loadVideoById(nextVideoId, 0);
    }
  }

  function preloadVideo(videoId, startSeconds) {
    if (!videoId) return;
    if (lastLoadRequest && lastLoadRequest.videoId === videoId) return;
    if (incomingFadeVideoId === videoId) return;
    var startSec = startSeconds || 0;
    var standbyIdx = 1 - activeDeckIndex;
    if (!deckReady[standbyIdx] || !decks[standbyIdx] || outgoingFadeDeckIdx === standbyIdx || incomingFadeDeckIdx === standbyIdx) {
      pendingPreload = { videoId: videoId, startSeconds: startSec };
      return;
    }
    if (standbyCued && standbyCued.videoId === videoId) {
      return;
    }
    var standbyPlayer = decks[standbyIdx];
    try {
      configureDeckAudioAndIframe(standbyPlayer, true);
      standbyCued = {
        videoId: videoId,
        startSeconds: startSec,
        state: -1,
        prebuffered: false,
        at: performance.now()
      };
      standbyPlayer.loadVideoById(videoId, startSec);
      console.log("AYP JS YT-BRIDGE: preloadVideo pre-buffering standby deck=" + standbyIdx + " id=" + videoId);
    } catch (e) {
      standbyCued = null;
    }
  }

  function loadVideo(videoId, startSeconds) {
    if (!player) return;
    if (cuedStartFallbackTimer) {
      clearTimeout(cuedStartFallbackTimer);
      cuedStartFallbackTimer = null;
    }

    var startSec = startSeconds || 0;
    var oldActiveIdx = activeDeckIndex;
    var standbyIdx = 1 - activeDeckIndex;
    lastSentDuration = 0;

    lastLoadRequest = { videoId: videoId, startSeconds: startSec, at: performance.now() };
    lastCueRequest = { videoId: videoId, startSeconds: startSec };
    unstartedRetryDone = false;

    // Caso 1: Crossfade sovrapposto GIA' in corso per questo videoId!
    // Il deck entrante sta GIA' suonando (es. a ~2s dall'inizio): promuoviamolo a player attivo
    // SENZA riavviarlo ne' fare seek a 0!
    if (incomingFadeDeckIdx === standbyIdx && incomingFadeVideoId === videoId && decks[standbyIdx]) {
      activeDeckIndex = standbyIdx;
      player = decks[activeDeckIndex];
      syncDeckWrapperClasses();

      var curTime = (typeof player.getCurrentTime === 'function') ? (player.getCurrentTime() || 0) : 0;
      var curState = (typeof player.getPlayerState === 'function') ? player.getPlayerState() : 1;
      console.log("AYP JS YT-BRIDGE: promoted already-crossfading deck=" + activeDeckIndex + " state=" + curState + " curTime=" + curTime.toFixed(2) + "s id=" + videoId);

      if (YouTubePlayerBridge) {
        YouTubePlayerBridge.sendVideoId(videoId);
        if (curTime > 0) {
          YouTubePlayerBridge.sendVideoCurrentTime(curTime);
        }
      }
      sendVideoData(player);
      if (curState === 1) {
        sendPlayerStateChange(YT.PlayerState.PLAYING);
      } else {
        player.playVideo();
      }
      return;
    }

    // Qualsiasi altro cambio traccia interrompe un eventuale crossfade precedente
    stopOutgoingDeckFadeOut(true);

    var isStandbyReady = deckReady[standbyIdx] && decks[standbyIdx];
    var isPreloadedMatch = isStandbyReady && standbyCued && standbyCued.videoId === videoId;

    if (isStandbyReady) {
      var outgoingDeck = decks[oldActiveIdx];
      var preCuedInfo = isPreloadedMatch ? standbyCued : null;
      standbyCued = null;

      try {
        if (outgoingDeck) {
          if (typeof outgoingDeck.mute === 'function') outgoingDeck.mute();
          if (typeof outgoingDeck.setVolume === 'function') outgoingDeck.setVolume(0);
          if (typeof outgoingDeck.pauseVideo === 'function') outgoingDeck.pauseVideo();
        }
      } catch (e) {}

      activeDeckIndex = standbyIdx;
      player = decks[activeDeckIndex];
      syncDeckWrapperClasses();
      configureDeckAudioAndIframe(player, false);

      if (desiredPlaybackRate !== 1 && typeof player.setPlaybackRate === 'function') {
        try { player.setPlaybackRate(desiredPlaybackRate); } catch (e) {}
      }

      if (YouTubePlayerBridge) YouTubePlayerBridge.sendVideoId(videoId);

      if (preCuedInfo) {
        var currentDeckState = (typeof player.getPlayerState === 'function') ? player.getPlayerState() : preCuedInfo.state;
        console.log("AYP JS YT-BRIDGE: swapped to preloaded deck=" + activeDeckIndex + " state=" + currentDeckState + " prebuffered=" + preCuedInfo.prebuffered + " id=" + videoId);

        if ((preCuedInfo.prebuffered || currentDeckState === 2 || currentDeckState === 5) && startSec <= 0.05) {
          // NON fare seekTo(0) se siamo gia' nei primi 1.5s del buffer: seekTo(0) svuota il decoder MSE!
          player.playVideo();
          sendVideoData(player);
          var activePlayerRef = player;
          cuedStartFallbackTimer = setTimeout(function() {
            cuedStartFallbackTimer = null;
            if (player !== activePlayerRef) return;
            var st = (typeof player.getPlayerState === 'function') ? player.getPlayerState() : -1;
            if (st !== 1 && st !== 3) {
              console.log("AYP JS YT-BRIDGE: prebuffered playVideo fallback -> loadVideoById id=" + videoId);
              player.loadVideoById(videoId, startSec);
            }
          }, 400);
        } else if (currentDeckState === 1) {
          sendPlayerStateChange(YT.PlayerState.PLAYING);
        } else if (currentDeckState === 3) {
          var bufferingPlayerRef = player;
          cuedStartFallbackTimer = setTimeout(function() {
            cuedStartFallbackTimer = null;
            if (player !== bufferingPlayerRef) return;
            var st = (typeof player.getPlayerState === 'function') ? player.getPlayerState() : -1;
            if (st !== 1 && st !== 3) {
              player.loadVideoById(videoId, startSec);
            }
          }, 600);
        } else {
          player.loadVideoById(videoId, startSec);
        }
      } else {
        console.log("AYP JS YT-BRIDGE: swapped to standby deck=" + activeDeckIndex + " cold loadVideoById id=" + videoId);
        player.loadVideoById(videoId, startSec);
      }
      return;
    }

    configureDeckAudioAndIframe(player, false);
    player.loadVideoById(videoId, startSec);
    if (YouTubePlayerBridge) YouTubePlayerBridge.sendVideoId(videoId);

    console.log("AYP JS YT-BRIDGE: loadVideo id=" + videoId + " start=" + startSec);
  }

  function cueVideo(videoId, startSeconds) {
    if (!player) return;
    lastCueRequest = { videoId: videoId, startSeconds: startSeconds };
    unstartedRetryDone = false;
    player.cueVideoById(videoId, startSeconds);
    if (YouTubePlayerBridge) YouTubePlayerBridge.sendVideoId(videoId);
    console.log("AYP JS YT-BRIDGE: cueVideo id=" + videoId + " start=" + startSeconds);
  }

  function mute() { if(player) player.mute(); }
  function unMute() { if(player) player.unMute(); }
  function getVolume() { if(player) player.getVolume(); }
  function setVolume(volumePercent) {
      if (volumePercent > 0) {
          desiredVolume = volumePercent;
      } else if (!crossfadeTimer) {
          desiredVolume = 0;
      }
      // Durante il crossfade dual-deck gestito dal mixer JS, non sovrascrivere le rampe dei due deck!
      if (crossfadeTimer) {
          return;
      }
      if (player) {
          if (volumePercent > 0 && typeof player.unMute === 'function') {
              player.unMute();
          }
          if (typeof player.setVolume === 'function') {
              player.setVolume(volumePercent);
          }
      }
  }
  function setPlaybackRate(playbackRate) {
      desiredPlaybackRate = playbackRate;
      if(player) player.setPlaybackRate(playbackRate);
  }
  function toggleFullscreen() { if(player) player.toggleFullscreen(); }
  function nextVideo() { if(player) player.nextVideo(); }
  function previousVideo() { if(player) player.previousVideo(); }
  function playVideoAt(index) { if(player) player.playVideoAt(index); }
  function setLoop(loop) { if(player) player.setLoop(loop); }
  function setShuffle(shuffle) { if(player) player.setShuffle(shuffle); }
</script>
</html>
